<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Palier — carnet muscu</title>
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palier">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0d;--s1:#121418;--s2:#1a1d22;--s3:#252930;--line:#1e2227;
  --tx:#eef0f3;--tx2:#959ba6;--tx3:#5c626c;
  --ac:#c6f36b;--ac2:#d7f88f;--acink:#0e1405;--acbg:rgba(198,243,107,.09);--acln:rgba(198,243,107,.28);
  --ok:#c6f36b;--okbg:rgba(198,243,107,.08);--warn:#e6c36e;--warnbg:rgba(230,195,110,.09);--bad:#e48a96;--badbg:rgba(228,138,150,.09);
  --info:#9fb8ff;--infobg:rgba(159,184,255,.09);
  --r:18px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,label.btn,nav a,.chip,.list-item,summary{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{padding-top:var(--st);overscroll-behavior-y:none}
.num{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.2px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:1px solid transparent;border-radius:12px;padding:11px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acln)}
input::placeholder{color:var(--tx3)}
.app{max-width:560px;margin:0 auto;padding:0 18px calc(96px + var(--sb))}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 6px}
.brand{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-weight:700;font-size:24px;letter-spacing:1.5px;text-transform:uppercase;line-height:1}
.brand b{color:var(--ac);font-weight:700}
.status{display:flex;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx3)}
.dot.on{background:var(--ac)}
h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx3);margin:28px 0 10px}
h3{margin:0;font-size:16px;font-weight:600}
.muted{color:var(--tx2)}.faint{color:var(--tx3)}
.card{background:var(--s1);border-radius:var(--r);padding:16px}
.stack>*+*{margin-top:8px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;background:var(--s2);font-weight:600;font-size:14px;white-space:nowrap}
.btn:active,.icon-btn:active,.play:active{transform:scale(.97)}
.btn.pri{background:var(--ac);color:var(--acink)}
.btn.ghost{background:transparent;color:var(--tx2)}
.btn.danger{background:transparent;color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.big-cta{width:100%;padding:16px;border-radius:var(--r);background:var(--ac);color:var(--acink);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--s1);border-radius:16px;padding:14px 12px}
.tile .v{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:28px;font-weight:600;line-height:1}
.tile .l{font-size:11.5px;color:var(--tx3);margin-top:5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{padding:7px 13px;border-radius:999px;background:var(--s2);font-size:13px;white-space:nowrap;color:var(--tx2)}
.chip.on{background:var(--ac);color:var(--acink);font-weight:600}
.rt{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px}
.rt-sub{font-size:12.5px;color:var(--tx3);margin-top:3px}
.play{width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--acink);display:flex;align-items:center;justify-content:center;flex:none}
.empty{padding:28px 16px;text-align:center;color:var(--tx3);background:var(--s1);border-radius:var(--r);font-size:14px}
.link{color:var(--tx2);font-size:13px;font-weight:500}
/* bottom nav */
nav.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,11,13,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:8px 8px calc(8px + var(--sb));z-index:20}
nav.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.bar a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--tx3);text-decoration:none;padding:6px 0;font-weight:500}
nav.bar a.on{color:var(--ac)}
nav.bar svg{width:22px;height:22px}
/* workout layer */
#workout{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;display:none;padding-top:var(--st)}
#workout.open{display:block}
.wk-head{position:sticky;top:0;z-index:5;background:rgba(10,11,13,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.wk-head .in{max-width:560px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.wk-name{background:transparent;border:0;padding:0;font-weight:600;font-size:16px}
.wk-time{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:18px;color:var(--ac)}
.wk-body{max-width:560px;margin:0 auto;padding:8px 18px calc(130px + var(--sb))}
.ex{background:var(--s1);border-radius:var(--r);margin-top:12px;overflow:hidden}
.ex-h{display:flex;align-items:center;gap:12px;padding:14px 14px 4px}
.ex-n{font-weight:600;font-size:15.5px;line-height:1.25}
.ex-m{font-size:12.5px;color:var(--tx3);margin-top:3px}
.icon-btn{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--tx3);background:transparent;flex:none}
.thumb{width:52px;height:46px;flex:none;background:var(--s2);border-radius:12px;padding:3px}
.thumb.sm{width:42px;height:37px;border-radius:10px;padding:2px}
.thumb.lg{width:112px;height:98px;border-radius:16px;padding:6px}
.ex-hero{display:flex;gap:14px;align-items:center;margin-top:14px}
.coach{margin:8px 12px 2px;border-radius:14px;background:var(--s2)}
.coach summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;cursor:pointer}
.coach summary::-webkit-details-marker{display:none}
.pill{font-size:11px;font-weight:600;padding:4px 8px;border-radius:7px;background:var(--s3);color:var(--tx2);white-space:nowrap}
.coach.up .pill{background:var(--ac);color:var(--acink)}
.coach.hold .pill{color:var(--warn)}
.coach.deload .pill{color:var(--bad)}
.coach-val{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:21px;font-weight:600;line-height:1}
.coach .why{padding:0 12px 12px;font-size:13px;line-height:1.5;color:var(--tx2)}
.coach .why p{margin:0 0 6px}
.chev{color:var(--tx3);transition:transform .2s;flex:none}
.coach[open] .chev{transform:rotate(180deg)}
.sets{padding:6px 8px 2px}
.srow{display:grid;grid-template-columns:30px 1fr 70px 56px 50px 46px;gap:6px;align-items:center;padding:4px 4px;border-radius:14px;min-height:52px}
.srow.no-rpe{grid-template-columns:30px 1fr 80px 66px 46px}
.srow.head{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);padding-top:6px;padding-bottom:2px}
.srow.head>div{text-align:center}
.srow.head>div:nth-child(2){text-align:left}
.srow.done{background:var(--acbg)}
.sn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--tx3)}
.sn.w{color:var(--warn)}
.prev{font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;padding:6px 0}
.srow input{height:44px;padding:0 4px;text-align:center;font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:18px;font-weight:600;border-radius:10px;background:var(--s2)}
.srow.done input{background:transparent}
.chk{width:46px;height:44px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.srow.done .chk{background:var(--ac);color:var(--acink)}
.ex-f{display:flex;gap:4px;padding:4px 10px 12px}
.ex-f .btn.sm{padding:10px 12px}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:10px 14px calc(12px + var(--sb));background:rgba(18,20,24,.97);display:none}
.rest.open{display:block}
.rest .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.rest .btn.sm{padding:12px 14px;font-size:14px;border-radius:12px}
.rest-t{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:32px;font-weight:600;min-width:84px}
.rest-bar{height:3px;background:var(--s3);border-radius:3px;overflow:hidden;margin:0 auto 10px;max-width:560px}
.rest-bar i{display:block;height:100%;background:var(--ac);width:100%;transition:width 1s linear}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--s1);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px 18px calc(22px + var(--sb))}
.sheet h3{font-size:17px;margin-bottom:14px}
.sheet:before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:var(--s3);margin:-8px auto 16px}
img.thumb{object-fit:cover;padding:0;display:block}
.big-map{width:220px;height:190px}
@media(min-width:620px){.modal{align-items:center}.sheet{border-radius:22px}}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 2px;cursor:pointer}
.lbl{font-size:12px;color:var(--tx3);margin:12px 0 5px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ri{background:var(--s2);border-radius:14px;padding:10px;margin-top:8px}
.ri input{background:var(--s3)}
.ri .grid3 input{padding:8px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sb));transform:translateX(-50%) translateY(20px);background:var(--s3);color:var(--tx);padding:11px 16px;border-radius:14px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sess{padding:14px 16px;cursor:pointer}
.sess-meta{font-size:12.5px;color:var(--tx3);margin-top:3px}
.detail{margin-top:12px;font-size:13px}
.detail .dx{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.detail .dx span:last-child{color:var(--tx2);text-align:right}
.pr{color:var(--ac);font-size:11px;font-weight:700}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--s3);border-radius:10px;padding:7px 10px;font-size:12.5px;white-space:nowrap;display:none;z-index:2;box-shadow:0 6px 20px rgba(0,0,0,.4)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{color:var(--tx3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:6px 4px}
table.t td{padding:9px 4px;border-top:1px solid var(--line)}
table.t td.r,table.t th.r{text-align:right}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--s3);border-radius:26px;transition:.2s}
.switch span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#d9dce1;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--ac)}
.switch input:checked+span:before{transform:translateX(18px);background:var(--acink)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row input{width:96px;text-align:right;padding:8px 10px}
.loading{padding:60px 0;text-align:center;color:var(--tx3)}
details.more summary{list-style:none;cursor:pointer;color:var(--tx2);font-size:13.5px;padding:2px 0}
details.more summary::-webkit-details-marker{display:none}
.chat-log{height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.bub{align-self:flex-start;max-width:88%;background:var(--s2);padding:10px 13px;border-radius:16px 16px 16px 6px;font-size:14.5px;line-height:1.45}
.bub.me{align-self:flex-end;background:var(--s3);border-radius:16px 16px 6px 16px}
.prop{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:13.5px;color:var(--tx)}
.method{font-size:13px;color:var(--tx2);line-height:1.55}
.method b{color:var(--tx);font-weight:600}
</style>
</head>

<div class="app" id="app"><div class="loading">Chargement…</div></div>

<nav class="bar" id="nav"><div class="in">
  <a href="#seance" data-v="seance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Séance</a>
  <a href="#historique" data-v="historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Historique</a>
  <a href="#progres" data-v="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 3 3 7-7"/><path d="M15 7h4v4"/></svg>Progrès</a>
  <a href="#reglages" data-v="reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Réglages</a>
</div></nav>

<div id="workout"></div>
<div class="rest" id="rest"><div class="rest-bar"><i id="restBar"></i></div><div class="in">
  <div><div class="faint" style="font-size:11px;text-transform:uppercase;letter-spacing:.6px">Repos</div><div class="rest-t" id="restT">0:00</div></div>
  <div class="grow"></div>
  <button class="btn sm" data-rest="-15">−15 s</button><button class="btn sm" data-rest="15">+15 s</button><button class="btn sm pri" data-rest="skip">Passer</button>
</div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ utils ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{if(n===''||n==null||isNaN(n))return '';n=Math.round(n*100)/100;return String(n).replace('.',',')};
const pnum=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const DAY=86400000;
const fdate=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const fshort=t=>{const d=new Date(t);return d.toLocaleDateString('fr-FR',d.getFullYear()===new Date().getFullYear()?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'2-digit'})};
const fdur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h${String(m).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
const fmin=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const timeout=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j({code:'timeout'}),ms))]);
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms)}

/* ============ exercise library ============ */
const MUSCLES=['Pectoraux','Dos','Épaules','Jambes','Bras','Abdos'];
const KINDS={barbell:'Barre',dumbbell:'Haltères',machine:'Machine',cable:'Poulie',bw:'Poids du corps / lesté'};
const LIB=[
 ['bench','Développé couché','Pectoraux','barbell'],['incline_bench','Développé incliné barre','Pectoraux','barbell'],
 ['db_bench','Développé couché haltères','Pectoraux','dumbbell'],['incline_db','Développé incliné haltères','Pectoraux','dumbbell'],
 ['dips','Dips lestés','Pectoraux','bw'],['chest_press','Chest press','Pectoraux','machine'],
 ['cable_fly','Écarté poulie','Pectoraux','cable',1],['pec_deck','Pec deck','Pectoraux','machine',1],
 ['pullup','Tractions lestées','Dos','bw'],['chinup','Tractions supination lestées','Dos','bw'],
 ['row','Rowing barre','Dos','barbell'],['tbar','Rowing T-bar','Dos','machine'],
 ['db_row','Rowing haltère unilatéral','Dos','dumbbell'],['lat_pulldown','Tirage vertical','Dos','cable'],
 ['seated_row','Tirage horizontal poulie','Dos','cable'],['deadlift','Soulevé de terre','Dos','barbell'],
 ['rack_pull','Rack pull','Dos','barbell'],['pullover','Pull-over poulie','Dos','cable',1],
 ['shrug','Shrugs haltères','Dos','dumbbell',1],['face_pull','Face pull','Épaules','cable',1],
 ['ohp','Développé militaire','Épaules','barbell'],['db_press','Développé épaules haltères','Épaules','dumbbell'],
 ['lateral','Élévations latérales','Épaules','dumbbell',1],['cable_lateral','Élévations latérales poulie','Épaules','cable',1],
 ['rear_delt','Oiseau machine','Épaules','machine',1],
 ['squat','Squat','Jambes','barbell'],['front_squat','Front squat','Jambes','barbell'],
 ['rdl','Soulevé de terre roumain','Jambes','barbell'],['leg_press','Presse à cuisses','Jambes','machine'],
 ['hack','Hack squat','Jambes','machine'],['bulgarian','Squat bulgare','Jambes','dumbbell'],
 ['lunge','Fentes marchées','Jambes','dumbbell'],['hip_thrust','Hip thrust','Jambes','barbell'],
 ['leg_ext','Leg extension','Jambes','machine',1],['leg_curl','Leg curl','Jambes','machine',1],
 ['calf','Mollets debout','Jambes','machine',1],
 ['curl','Curl barre','Bras','barbell',1],['db_curl','Curl haltères','Bras','dumbbell',1],
 ['hammer','Curl marteau','Bras','dumbbell',1],['preacher','Curl pupitre','Bras','machine',1],
 ['pushdown','Extension triceps poulie','Bras','cable',1],['oh_ext','Extension triceps nuque poulie','Bras','cable',1],
 ['skull','Barre au front','Bras','barbell',1],['close_grip','Développé couché prise serrée','Bras','barbell'],
 ['hanging_leg','Relevés de jambes suspendu','Abdos','bw',1],['cable_crunch','Crunch poulie','Abdos','cable',1],
 ['ab_wheel','Roue abdominale','Abdos','bw',1],
].map(([id,n,m,k,iso])=>({id,n,m,k,iso:!!iso}));

function musclesOf(ex){const s=(ex.n+' '+ex.id).toLowerCase();for(const [re,p,q] of MAP)if(re.test(s))return {p,q};const d=MUS_DEF[ex.m]||[[],[]];return {p:d[0],q:d[1]}}
const svgCache={};
function bodySvg(ex,cls='thumb'){
  const key=ex.id+cls;if(svgCache[key])return svgCache[key];
  const {p,q}=musclesOf(ex);
  const f=m=>p.includes(m)?'#c6f36b':q.includes(m)?'#5f7a33':'#2a2e35';
  const E=(x,y,rx,ry,m,rot)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f(m)}"${rot?` transform="rotate(${rot} ${x} ${y})"`:''}/>`;
  const sil=c=>`<g fill="#1d2025"><circle cx="${c}" cy="10" r="6.5"/><rect x="${c-3}" y="15" width="6" height="5" rx="2"/><path d="M${c-13} 21 Q${c} 17 ${c+13} 21 L${c+12} 52 Q${c} 56 ${c-12} 52Z"/><path d="M${c-11} 52 L${c+11} 52 L${c+10} 100 L${c+1.5} 100 L${c} 62 L${c-1.5} 100 L${c-10} 100Z"/><path d="M${c-13} 22 L${c-19} 58 L${c-15} 58 L${c-10} 30Z"/><path d="M${c+13} 22 L${c+19} 58 L${c+15} 58 L${c+10} 30Z"/></g>`;
  const a=30,b=90;
  const front=sil(a)+E(a-11,24.5,4.2,4,'delts')+E(a+11,24.5,4.2,4,'delts')
    +E(a-5,28.5,5.6,4.4,'chest')+E(a+5,28.5,5.6,4.4,'chest')
    +`<rect x="${a-5}" y="34.5" width="10" height="16" rx="3" fill="${f('abs')}"/>`
    +E(a-14.5,35,2.8,6,'biceps',12)+E(a+14.5,35,2.8,6,'biceps',-12)
    +E(a-17,48.5,2.4,6.5,'forearms',10)+E(a+17,48.5,2.4,6.5,'forearms',-10)
    +E(a-5.5,69,4.4,11,'quads',4)+E(a+5.5,69,4.4,11,'quads',-4)
    +E(a-5.5,90,2.8,7.5,'calves')+E(a+5.5,90,2.8,7.5,'calves');
  const back=sil(b)+`<path d="M${b-9} 20 L${b} 15.5 L${b+9} 20 L${b+3} 31 L${b-3} 31Z" fill="${f('traps')}"/>`
    +E(b-11.5,24.5,4,3.8,'rdelts')+E(b+11.5,24.5,4,3.8,'rdelts')
    +`<path d="M${b-11} 28 Q${b-4} 30 ${b-1.5} 33 L${b-2} 45 Q${b-8} 44 ${b-10} 40Z" fill="${f('lats')}"/><path d="M${b+11} 28 Q${b+4} 30 ${b+1.5} 33 L${b+2} 45 Q${b+8} 44 ${b+10} 40Z" fill="${f('lats')}"/>`
    +`<path d="M${b-3} 31 L${b+3} 31 L${b+1.5} 37 L${b-1.5} 37Z" fill="${f('back')}"/>`
    +`<rect x="${b-3.5}" y="44" width="7" height="7" rx="2" fill="${f('lowback')}"/>`
    +E(b-14.5,35,2.8,6,'triceps',12)+E(b+14.5,35,2.8,6,'triceps',-12)
    +E(b-17,48.5,2.4,6.5,'forearms',10)+E(b+17,48.5,2.4,6.5,'forearms',-10)
    +E(b-5,57,5,5,'glutes')+E(b+5,57,5,5,'glutes')
    +E(b-5.5,74,4.2,9.5,'hams',3)+E(b+5.5,74,4.2,9.5,'hams',-3)
    +E(b-5.5,90,3.4,7.5,'calves')+E(b+5.5,90,3.4,7.5,'calves');
  return svgCache[key]=`<svg class="${cls}" viewBox="0 0 120 104" aria-hidden="true">${front}${back}</svg>`;
}

/* ============ storage (cloud db + local cache) ============ */
const LS='surcharge.v1';
function readLocal(){try{const v=localStorage.getItem(LS);return v?JSON.parse(v):null}catch(e){return null}}
function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const Store={mode:'local',col:null,chains:{},timers:{},
  async init(){
    hydrate(readLocal()||{});this.mode='local';
    try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
    return 'local';
  },
  run(key,fn){
    this.chains[key]=(this.chains[key]||Promise.resolve()).then(async()=>{
      try{await fn()}catch(e){
        if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*900));try{await fn();return}catch(e2){e=e2}}
        if(e&&e.code==='quota_exceeded')toast('Espace de sauvegarde plein : supprime d’anciennes séances.');
        else if(e&&e.code==='invalid_argument'){this.mode='readonly';toast('Sauvegarde en ligne refusée — données gardées sur cet appareil.');}
        else toast('Sauvegarde en ligne impossible pour l’instant.');
      }});
    return this.chains[key];
  },
  later(key,ms,fn){clearTimeout(this.timers[key]);this.timers[key]=setTimeout(()=>this.run(key,fn),ms)},
  put(key,obj){return this.run(key,()=>this.col.doc(key).set(clone(obj)))},
  del(key){return this.run(key,()=>this.col.doc(key).delete())},
  meta(){return{settings:S.settings,routines:S.routines,custom:S.custom}},
  saveMeta(){cacheLocal();if(this.mode==='cloud')this.later('meta',700,()=>this.col.doc('meta').set(clone(this.meta())))},
  saveActive(){cacheLocal();if(this.mode==='cloud')this.later('active',1200,()=>S.active?this.col.doc('active').set({w:clone(S.active)}):this.col.doc('active').delete())},
  saveSession(s){cacheLocal();if(this.mode==='cloud')this.put('s-'+s.id,s)},
  delSession(id){cacheLocal();if(this.mode==='cloud')this.del('s-'+id)},
  async pushAll(oldIds=[]){
    cacheLocal();if(this.mode!=='cloud')return;
    await this.put('meta',this.meta());
    for(const id of oldIds) if(!S.sessions.find(s=>s.id===id)) await this.del('s-'+id);
    for(const s of S.sessions) await this.put('s-'+s.id,s);
    if(S.active)await this.put('active',{w:S.active});else await this.del('active');
  }
};

/* ============ analytics ============ */
function e1(kg,reps,ex){const L=(kg||0)+bwAdd(ex);if(!reps||reps<=0||L<=0)return 0;return reps===1?L:L*(1+Math.min(reps,15)/30)}
function workSets(e){return (e.sets||[]).filter(x=>!x.warm&&x.done!==false&&x.kg!=null&&x.reps>0)}
function histFor(exId,beforeTs=Infinity){
  const out=[];
  for(const s of S.sessions){ if(s.date>=beforeTs)continue;
    const es=s.exercises.filter(e=>e.exId===exId);if(!es.length)continue;
    const sets=es.flatMap(workSets);if(sets.length)out.push({date:s.date,sets,sid:s.id,min:es[0].min,max:es[0].max});}
  return out.sort((a,b)=>b.date-a.date);
}
function bestE1(exId,beforeTs){const ex=getEx(exId);let b=0;for(const h of histFor(exId,beforeTs))for(const x of h.sets)b=Math.max(b,e1(x.kg,x.reps,ex));return b}
const roundTo=(w,inc)=>Math.max(0,Math.round(w/inc)*inc);
const r2=v=>Math.round(v*100)/100;
function knownLoads(exId){const k=new Set();for(const h of histFor(exId))for(const x of h.sets)k.add(x.kg);return [...k].sort((a,b)=>a-b)}
function loadUp(exId,w,jump,inc){const k=knownLoads(exId).filter(v=>v>w+1e-6&&v<=w+jump+inc*0.75+1e-6);if(k.length)return k[0];const g=Math.abs(w/inc-Math.round(w/inc))<1e-6;return g?roundTo(w+jump,inc):r2(w+jump)}
function loadDown(exId,target,w,inc){const k=knownLoads(exId).filter(v=>v<w-1e-6&&Math.abs(v-target)<=inc+1e-6);if(k.length)return k.reduce((a,b)=>Math.abs(b-target)<Math.abs(a-target)?b:a);const g=Math.abs(w/inc-Math.round(w/inc))<1e-6;return g?roundTo(target,inc):Math.round(target*4)/4}
const setsStr=sets=>sets.map(x=>`${fmt(x.kg)}×${x.reps}${x.rpe?` @${fmt(x.rpe)}`:''}`).join(' · ');

/* The coach: double progression + RPE autoregulation + stall detection */
function recommend(exId,min,max){
  const ex=getEx(exId),inc=incFor(ex),add=bwAdd(ex),H=histFor(exId);
  const unit=ex.k==='dumbbell'?' kg / haltère':ex.k==='bw'?' kg de lest':' kg';
  if(!H.length) return {tag:'new',label:'1ʳᵉ fois',w:null,reps:max,
    why:`Pas encore d’historique. Choisis une charge qui te permet ${max} reps propres en gardant 2-3 reps en réserve (RPE 7-8). Le coach s’en servira comme base dès la prochaine séance.`};
  const last=H[0],sets=last.sets;
  const topW=Math.max(...sets.map(x=>x.kg));
  const top=sets.filter(x=>x.kg===topW);
  const lo=Math.min(...top.map(x=>x.reps));
  const allMax=top.every(x=>x.reps>=max);
  const rp=top.map(x=>+x.rpe).filter(x=>x>0);const rpe=rp.length?rp.reduce((a,b)=>a+b,0)/rp.length:null;
  let w=topW,reps,tag,why,label;
  if(allMax){
    if(rpe!=null&&rpe>=9.5){tag='hold';label='Consolider';reps=max;
      why=`Haut de fourchette atteint (${max} reps) mais à l’échec (RPE ${fmt(Math.round(rpe*10)/10)}). Refais la même charge en visant des reps plus « propres » avant d’augmenter.`}
    else{const jump=(rpe!=null&&rpe<=7&&2*inc<=0.1*(topW+add))?2*inc:inc;w=loadUp(exId,topW,jump,inc);reps=min;tag='up';label='+ Charge';
      why=`Toutes tes séries à ${fmt(topW)} kg ont atteint ${max} reps${rpe!=null?` (RPE moyen ${fmt(Math.round(rpe*10)/10)})`:''} : on monte à ${fmt(w)} kg (+${fmt(r2(w-topW))}) et on repart du bas de fourchette (${min} reps).${jump>inc?' Gros saut car il te restait de la marge.':''}`}
  }else if(lo>=min){
    reps=Math.min(max,lo+1);tag='reps';label='+ Reps';
    why=`Double progression : garde ${fmt(topW)} kg et ajoute 1 rep sur ta série la plus faible (${lo} → ${reps}). Quand toutes les séries atteignent ${max}, on augmente la charge.`;
  }else{
    const prev=H[1];let prevFail=false;
    if(prev){const pw=Math.max(...prev.sets.map(x=>x.kg));if(pw===topW)prevFail=Math.min(...prev.sets.filter(x=>x.kg===pw).map(x=>x.reps))<min}
    if(prevFail){w=loadDown(exId,(topW+add)*0.9-add,topW,inc);reps=Math.round((min+max)/2);tag='deload';label='Décharge';
      why=`Deux séances de suite sous ${min} reps à ${fmt(topW)} kg : décharge de 10 % (${fmt(w)} kg) pour relancer la progression. Tu remonteras vite.`}
    else{reps=min;tag='hold';label='Consolider';
      why=`Dernière séance sous la fourchette (${lo} reps). On garde ${fmt(topW)} kg et on vise au moins ${min} reps partout. Si ça recoince la prochaine fois, le coach proposera une décharge.`}
  }
  // stall detection over last 3 sessions
  let stall='';
  if(H.length>=3&&tag!=='up'&&tag!=='deload'){
    const score=h=>{const tw=Math.max(...h.sets.map(x=>x.kg));return tw*1000+h.sets.filter(x=>x.kg===tw).reduce((a,x)=>a+x.reps,0)};
    if(score(H[0])<=score(H[1])&&score(H[1])<=score(H[2]))stall='Aucun progrès sur 3 séances : pense sommeil / récup, ou change de variante pendant 3-4 semaines.';
  }
  w=Math.max(0,w);
  const best=bestE1(exId);
  let pred=null;const L=w+add;if(best&&L>0){pred=Math.floor(30*(best/L-1));if(pred<1||pred>20)pred=null}
  // warm-up ramp for heavy compounds
  let warm=null;
  if(!ex.iso&&(ex.k==='barbell')&&w>=40){
    const bar=20;const ramp=[[.5,8],[.7,5],[.85,2]].map(([p,r])=>[Math.max(bar,roundTo(w*p,2.5)),r]).filter((x,i,a)=>x[0]<w&&(i===0||x[0]!==a[i-1][0]));
    if(ramp.length)warm=ramp;
  }
  return {tag,label,w,reps,why,stall,unit,last,best,pred,warm,add};
}

function weekStats(){
  const now=Date.now(),d=new Date();const monday=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)).getTime();
  const wk=S.sessions.filter(s=>s.date>=monday);
  const vol7=S.sessions.filter(s=>s.date>=now-7*DAY).reduce((a,s)=>a+sessVol(s),0);
  return {wk:wk.length,vol7,total:S.sessions.length};

let progAll=false;
function vProg(){
  const ids=exWithHistory();

  if(!progEx||!ids.includes(progEx))progEx=ids[0];
  const ex=getEx(progEx),H=histFor(progEx).reverse();
  const pts=H.map(h=>{let b=h.sets[0],be=0;for(const x of h.sets){const v=e1(x.kg,x.reps,ex);if(v>be){be=v;b=x}}return {t:h.date,y:Math.round(be*10)/10,set:b}});
  const best=Math.max(...pts.map(p=>p.y));const bp=pts.find(p=>p.y===best);
  const first=pts[0].y,lastp=pts[pts.length-1];
  const gain=first?Math.round((lastp.y-first)/first*1000)/10:0;
  const L=H[H.length-1];const rec=recommend(progEx,L.min||defRange(ex)[0],L.max||defRange(ex)[1]);

  </div>

  ${shown.map((p,i)=>`<tr><td style="white-space:nowrap">${fshort(p.t)}</td><td class="muted num" style="font-size:15px">${H[H.length-1-i].sets.map(x=>`${fmt(x.kg)}×${x.reps}`).join('  ')}</td><td class="r num" style="font-size:16px">${fmt(Math.round(p.y))}${p.y===best?' <span class="pr">PR</span>':''}</td></tr>`).join('')}
  </tbody></table>${rows.length>6?`<button class="link" data-a="progAll" style="padding:10px 4px 6px">${progAll?'Réduire':`Tout afficher (${rows.length})`}</button>`:''}</div>`;
  vProg.pts=pts;
  return h;
}
function mountChart(){
  const el=$('#chart');if(!el)return;const pts=vProg.pts||[];
  const W=Math.max(280,el.clientWidth),Hh=210,p={l:38,r:14,t:14,b:26};
  const ys=pts.map(q=>q.y);let lo=Math.min(...ys),hi=Math.max(...ys);
  const pad=Math.max(2,(hi-lo)*.15);lo=Math.floor((lo-pad)/5)*5;hi=Math.ceil((hi+pad)/5)*5;if(hi===lo)hi=lo+5;
  const t0=pts[0].t,t1=pts[pts.length-1].t;
  const X=t=>pts.length===1?(p.l+(W-p.l-p.r)/2):p.l+(t-t0)/(t1-t0||1)*(W-p.l-p.r);
  const Y=v=>p.t+(hi-v)/(hi-lo)*(Hh-p.t-p.b);
  const step=Math.max(5,Math.ceil((hi-lo)/4/5)*5);
  let g='';for(let v=lo;v<=hi+0.001;v+=step){g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1e2227" stroke-width="1"/><text x="${p.l-8}" y="${Y(v)+4}" text-anchor="end" fill="#5c626c" font-size="11">${v}</text>`}
  const d=pts.map((q,i)=>`${i?'L':'M'}${X(q.t).toFixed(1)},${Y(q.y).toFixed(1)}`).join('');
  const area=pts.length>1?`<path d="${d}L${X(t1)},${Hh-p.b}L${X(t0)},${Hh-p.b}Z" fill="url(#gr)"/>`:'';
  const dots=pts.map(q=>`<circle cx="${X(q.t)}" cy="${Y(q.y)}" r="3.5" fill="#c6f36b" stroke="#121418" stroke-width="2"/>`).join('');
  const xl=`<text x="${X(t0)}" y="${Hh-6}" text-anchor="${pts.length>1?'start':'middle'}" fill="#5c626c" font-size="11">${fshort(t0)}</text>`+(pts.length>1?`<text x="${X(t1)}" y="${Hh-6}" text-anchor="end" fill="#5c626c" font-size="11">${fshort(t1)}</text>`:'');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" height="${Hh}" role="img" aria-label="Courbe du 1RM estimé"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c6f36b" stop-opacity=".16"/><stop offset="1" stop-color="#c6f36b" stop-opacity="0"/></linearGradient></defs>${g}${area}<path d="${d}" fill="none" stroke="#c6f36b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line id="xh" y1="${p.t}" y2="${Hh-p.b}" stroke="#a7acb8" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>${dots}${xl}<rect x="0" y="0" width="${W}" height="${Hh}" fill="transparent" id="hit"/></svg><div class="tip" id="tip"></div>`;
  const svg=el.querySelector('svg'),tip=$('#tip'),xh=$('#xh');
  const move=ev=>{const r=svg.getBoundingClientRect();const x=(ev.clientX-r.left)*(W/r.width);let bi=0,bd=1e9;pts.forEach((q,i)=>{const dd=Math.abs(X(q.t)-x);if(dd<bd){bd=dd;bi=i}});const q=pts[bi];
    xh.setAttribute('x1',X(q.t));xh.setAttribute('x2',X(q.t));xh.style.display='';
    tip.innerHTML=`<div class="faint">${fdate(q.t)}</div><div><b class="num" style="font-size:16px">${fmt(Math.round(q.y))} kg</b> 1RM est.</div><div class="muted">meilleure série ${fmt(q.set.kg)} × ${q.set.reps}</div>`;
    tip.style.display='block';const px=X(q.t)*(r.width/W);const tw=tip.offsetWidth;tip.style.left=Math.min(Math.max(0,px-tw/2),r.width-tw)+'px';tip.style.top=(Y(q.y)*(r.height/Hh)-tip.offsetHeight-12<0?Y(q.y)*(r.height/Hh)+14:Y(q.y)*(r.height/Hh)-tip.offsetHeight-12)+'px'};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{tip.style.display='none';xh.style.display='none'});
}

    const r=await sample([{role:'user',content:TRAINER_RULES},...t],{cache:false,modelTier:'quick',signal,onText:({text})=>onText(text)});return r.text;
  }

function applyActions(actions){const A=S.active;if(!A)return 0;let n=0;
  for(const a of actions){if(!describeAction(a))continue;const e=A.exercises.find(x=>x.uid===a.ex);
    if(a.type==='load'){for(const s of e.sets)if(!s.done&&!s.warm){if(a.kg!=null)s.kg=Math.max(0,+a.kg);if(a.reps!=null)s.reps=Math.max(1,Math.round(+a.reps))}n++}
    else if(a.type==='sets'){const want=Math.max(1,Math.min(10,Math.round(+a.count)));let work=e.sets.filter(s=>!s.warm);
      while(work.length>want){const i=e.sets.map(s=>!s.warm&&!s.done).lastIndexOf(true);if(i<0)break;e.sets.splice(i,1);work=e.sets.filter(s=>!s.warm)}
      while(work.length<want){const last=work[work.length-1];e.sets.push({kg:last?last.kg:null,reps:null,rpe:null,warm:false,done:false});work=e.sets.filter(s=>!s.warm)}n++}
    else if(a.type==='rest'){e.rest=Math.max(0,Math.round(+a.sec));n++}
    else if(a.type==='swap'){const left=Math.max(1,e.sets.filter(s=>!s.done&&!s.warm).length);const ne=newExEntry(a.to,left);const i=A.exercises.indexOf(e);
      if(e.sets.some(s=>s.done))A.exercises.splice(i+1,0,ne);else A.exercises.splice(i,1,ne);n++}}
  if(n){recCache={};Store.saveActive();drawWorkout()}return n;}
let chatCtl=null;
const QUICK=['Je n’arrive pas à finir','Trop facile','J’ai une gêne / douleur','Machine prise','Je suis cramé'];
function openTrainer(){
  const A=S.active;if(!A)return;A.chat=A.chat||[];
  openModal(`<div class="row between" style="margin-bottom:8px"><h3 style="margin:0">Trainer</h3><button class="icon-btn" id="trClose" aria-label="Fermer">✕</button></div>
    <div id="trLog" class="chat-log"></div>
    <div class="chips" id="trQuick" style="margin:10px 0 8px">${QUICK.map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <form id="trForm" class="row" style="gap:8px"><input id="trIn" placeholder="Ex. 3e série : 6 reps au lieu de 8" autocomplete="off" enterkeyhint="send"><button class="btn pri" id="trSend" style="padding:12px 16px">↑</button></form>`,
  sh=>{
    const log=$('#trLog',sh);
    const draw=()=>{const msgs=A.chat;
      log.innerHTML=msgs.length?msgs.map((m,i)=>{if(m.role==='user')return `<div class="bub me">${esc(m.content)}</div>`;
        const {say,actions}=splitReply(m.content);const desc=actions.map(describeAction).filter(Boolean);
        return `<div class="bub">${esc(say||'…').replace(/\n/g,'<br>')}${desc.length?`<div class="prop">${desc.map(d=>`<div>• ${esc(d)}</div>`).join('')}${m.applied?'<div class="faint" style="margin-top:6px">✓ Appliqué</div>':`<button class="btn sm pri" data-apply="${i}" style="margin-top:8px">Appliquer</button>`}</div>`:''}</div>`}).join('')
        :`<div class="faint" style="font-size:13.5px;padding:8px 2px">Dis-moi comment se passe ta série (reps faites, sensation, douleur, machine prise…) et j’adapte la suite.</div>`;
      log.scrollTop=log.scrollHeight};
    draw();
    const send=async txt=>{txt=String(txt||'').trim();if(!txt||chatCtl)return;
      A.chat.push({role:'user',content:txt});Store.saveActive();$('#trIn',sh).value='';
      const turns=A.chat.map((m,i)=>i===A.chat.length-1?{role:'user',content:`ÉTAT DE LA SÉANCE :\n${trainerContext()}\n\nMESSAGE : ${txt}`}:{role:m.role,content:m.content});
      A.chat.push({role:'assistant',content:''});const idx=A.chat.length-1;draw();
      const bubble=()=>log.querySelector('.bub:last-child');
      if(bubble())bubble().innerHTML='<span class="faint">Je réfléchis…</span>';
      chatCtl=new AbortController();
      try{const text=await trainerCall(turns,t=>{A.chat[idx].content=t;const b=bubble();if(b)b.innerHTML=esc(splitReply(t).say||'…').replace(/\n/g,'<br>');log.scrollTop=log.scrollHeight},chatCtl.signal);
        A.chat[idx].content=text;}
      catch(e){A.chat.pop();const msg={nokey:'Ajoute ta clé API Anthropic dans Réglages pour activer le Trainer.',badkey:'Clé API refusée : vérifie-la dans Réglages.',offline:'Pas de réseau : le Trainer a besoin d’internet.',unavailable:'Le Trainer n’est pas disponible ici.',not_granted:'Accès à Claude refusé pour cette page.',rate_limited:'Trop de messages d’un coup, réessaie dans un moment.',cancelled:''}[e&&e.code];
        if(msg!=='')toast(msg||'Le Trainer n’a pas pu répondre, réessaie.',3500)}
      finally{chatCtl=null;if(A.chat.length>40)A.chat.splice(0,A.chat.length-40);Store.saveActive();draw()}};
    $('#trForm',sh).onsubmit=e=>{e.preventDefault();send($('#trIn',sh).value)};
    $('#trQuick',sh).onclick=e=>{const b=e.target.closest('[data-q]');if(b){const cur=S.active.exercises.find(x=>x.sets.some(s=>!s.done&&!s.warm));send(b.dataset.q+(cur?` (${getEx(cur.exId).n})`:''))}};
    log.onclick=e=>{const b=e.target.closest('[data-apply]');if(!b)return;const m=A.chat[+b.dataset.apply];const n=applyActions(splitReply(m.content).actions);m.applied=true;Store.saveActive();toast(n?'Séance adaptée':'Rien à appliquer');closeModal()};
    $('#trClose',sh).onclick=closeModal;
  },()=>{if(chatCtl){chatCtl.abort();chatCtl=null}});
}

/* rest timer */
let rest={end:0,total:0,iv:null},actx=null;
function startRest(sec){if(!sec)return;try{if(!actx&&S.settings.sound)actx=new (window.AudioContext||window.webkitAudioContext)();actx&&actx.resume&&actx.resume()}catch(e){}
  rest.total=sec;rest.end=Date.now()+sec*1000;$('#rest').classList.add('open');tickRest();clearInterval(rest.iv);rest.iv=setInterval(tickRest,250);armNotif()}
function armNotif(){if(NOTIF_OK&&S.settings.notif&&Notification.permission==='granted')swPost({type:'rest-start',end:rest.end,body:nextSetLabel()})}
function stopRest(){swPost({type:'rest-cancel'});clearInterval(rest.iv);rest.iv=null;$('#rest').classList.remove('open')}
function tickRest(){const left=(rest.end-Date.now())/1000;
  if(left<=0){clearInterval(rest.iv);rest.iv=null;$('#rest').classList.remove('open');beep();
    if(document.visibilityState==='visible')toast('Repos terminé — '+nextSetLabel(),3500);
    return}
  $('#restT').textContent=fmin(Math.ceil(left));$('#restBar').style.width=Math.max(0,left/rest.total*100)+'%'}
function beep(){try{navigator.vibrate&&navigator.vibrate([350,120,350,120,350])}catch(e){}
  if(!S.settings.sound||!actx)return;try{[0,0.25].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}}
$('#rest').addEventListener('click',e=>{const b=e.target.closest('[data-rest]');if(!b)return;const v=b.dataset.rest;
  if(v==='skip'){stopRest();return}rest.end+=(+v)*1000;rest.total=Math.max(rest.total,(rest.end-Date.now())/1000);tickRest();armNotif()});
setInterval(()=>{const el=$('#wkTime');if(el&&S.active)el.textContent=fdur((Date.now()-S.active.start)/1000)},1000);

/* ============ app actions ============ */
$('#app').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='resume')openWorkout();
  else if(a==='startEmpty'){if(S.active)return openWorkout();startWorkout('Séance libre',[])}
  else if(a==='startRoutine'){if(S.active){toast('Une séance est déjà en cours');return openWorkout()}const r=S.routines.find(x=>x.id===id);startWorkout(r.name,r.items.map(i=>newExEntry(i.exId,i.sets,i.min,i.max,i.rest)),r.id)}
  else if(a==='newRoutine')newRoutineSheet();
  else if(a==='photo')photoSheet(id,()=>render());
  else if(a==='progAll'){progAll=!progAll;const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='editRoutine')editRoutine(S.routines.find(x=>x.id===id));
  else if(a==='addTpl'){const t=TPL[+b.dataset.i];S.routines.push({id:uid(),name:t.name,items:t.items.map(([exId,sets,min,max,rest])=>({exId,sets,min,max,rest}))});Store.saveMeta();render();toast('Ajouté à tes programmes')}
  else if(a==='toggleSess'){openSess=openSess===id?null:id;const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='delSess'){if(await ask('Supprimer cette séance de l’historique ?','Supprimer',true)){S.sessions=S.sessions.filter(s=>s.id!==id);Store.delSession(id);render()}}
  else if(a==='redo'){if(S.active){toast('Une séance est déjà en cours');return openWorkout()}const s=S.sessions.find(x=>x.id===id);startWorkout(s.name,s.exercises.map(x=>newExEntry(x.exId,Math.max(1,x.sets.filter(q=>!q.warm).length),x.min,x.max)),s.routineId)}
  else if(a==='export'){const txt=JSON.stringify({app:'surcharge',v:1,settings:S.settings,routines:S.routines,custom:S.custom,sessions:S.sessions});
    const name=`palier-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;const blob=new Blob([txt],{type:'application/json'});
    try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sauvegarde Palier'});return}}catch(err){if(err&&err.name==='AbortError')return}
    const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Sauvegarde téléchargée')}
  else if(a==='copy'){const txt=JSON.stringify({app:'surcharge',v:1,settings:S.settings,routines:S.routines,custom:S.custom,sessions:S.sessions});
    try{await navigator.clipboard.writeText(txt);toast('Sauvegarde copiée — colle-la dans une note')}catch(err){openModal(`<h3>Ta sauvegarde</h3><p class="muted" style="font-size:13px">Sélectionne tout et copie ce texte.</p><textarea rows="8" readonly>${esc(txt)}</textarea><button class="btn block" style="margin-top:10px" id="xOk">Fermer</button>`,sh=>{const ta=$('textarea',sh);ta.focus();ta.select();$('#xOk',sh).onclick=closeModal})}}
  else if(a==='import'){openModal(`<h3>Importer une sauvegarde</h3><p class="muted" style="font-size:13px">Colle le texte copié depuis « Copier une sauvegarde ». Tes données actuelles seront remplacées.</p><label class="btn block" style="margin:6px 0 10px">Choisir un fichier .json<input type="file" id="imF" accept=".json,application/json,text/plain" style="display:none"></label><div class="faint" style="font-size:12px;text-align:center;margin-bottom:6px">ou colle le texte :</div><textarea id="imT" rows="6"></textarea><div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn ghost" id="imNo">Annuler</button><button class="btn pri" id="imGo">Importer</button></div>`,
    sh=>{$('#imNo',sh).onclick=closeModal;
      $('#imF',sh).onchange=async ev=>{const fl=ev.target.files[0];if(!fl)return;try{$('#imT',sh).value=await fl.text();$('#imGo',sh).click()}catch(err){toast('Fichier illisible')}};
      $('#imGo',sh).onclick=async()=>{let d;try{d=JSON.parse($('#imT',sh).value)}catch(err){toast('Texte invalide');return}
      if(!d||!Array.isArray(d.sessions)){toast('Ce n’est pas une sauvegarde Palier');return}
      const old=S.sessions.map(s=>s.id);hydrate({...d,active:S.active});closeModal();render();toast(Store.mode==='cloud'?'Synchronisation en cours… garde la page ouverte':'Import terminé',5000);await Store.pushAll(old);toast(`${S.sessions.length} séances importées`)}})}
  else if(a==='wipe'){if(await ask('Effacer toutes tes séances, programmes et réglages ? C’est définitif.','Tout effacer',true)){const old=S.sessions.map(s=>s.id);hydrate({});await Store.pushAll(old);render();toast('Données effacées')}}
});
$('#app').addEventListener('change',e=>{
  if(e.target.id==='apiKey'){setKey(e.target.value.trim());toast(e.target.value.trim()?'Clé enregistrée':'Clé supprimée');return}
  if(e.target.id==='progSel'){progEx=e.target.value;progAll=false;render();return}
  const k=e.target.dataset.set;if(!k)return;
  if(e.target.type==='checkbox'){S.settings[k]=e.target.checked;
    if(k==='notif'&&e.target.checked){Notification.requestPermission().then(p=>{if(p!=='granted'){S.settings.notif=false;e.target.checked=false;Store.saveMeta();toast('Notifications refusées — autorise-les dans les réglages Android de l’appli')}else toast('Notifications activées')})}}
  else{const v=pnum(e.target.value);if(v!=null&&v>=0)S.settings[k]=v;else e.target.value=fmt(S.settings[k])}
  Store.saveMeta();
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==='progres')mountChart()},150)});

/* ============ boot ============ */
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
window.addEventListener('online',()=>render());window.addEventListener('offline',()=>render());
(async()=>{
  const r=await Store.init();
  await Photos.load();
  render();
  if(NAME_FIX){NAME_FIX=false;Store.pushAll()}
  if(r==='migrated')toast('Tes données locales ont été synchronisées');
  if(S.active)toast('Séance en cours retrouvée — touche « Reprendre »');
})();
</script>
