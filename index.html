<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ironlog — carnet muscu</title>
<script src="./photos.js" defer></script>
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironlog">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--s1:#ffffff;--s2:#f1f3f5;--s3:#e3e7ec;--line:#ebeef2;
  --tx:#111418;--tx2:#5a626e;--tx3:#9aa1ab;
  --pri:#111418;--priink:#ffffff;--ac:#2f6bff;--acq:rgba(47,107,255,.35);--acbg:rgba(47,107,255,.08);--acln:rgba(47,107,255,.35);--acink:#ffffff;
  --ok:#16a34a;--okbg:rgba(22,163,74,.08);--okln:rgba(22,163,74,.32);--okink:#ffffff;
  --warn:#b7740a;--warnbg:rgba(183,116,10,.09);--bad:#d63c52;--badbg:rgba(214,60,82,.08);
  --blue:var(--ac);--violet:var(--ac);--orange:var(--ac);--yellow:var(--warn);--pink:var(--tx2);--aqua:var(--ok);
  --pic-bg:#f0f2f5;--pic-fig:#1a1f27;--pic-fig2:#9aa1ab;--pic-eq:#b4bbc6;--pic-soft:#e3e7ec;--pic-ac:#2f6bff;--an-body:#cdd2d9;--an-line:#8f97a3;--an-def:#bcc2ca;--an-far:#aab1bb;--an-shine:#fff;--an-hot:#e5432b;--an-hot2:#ff8a6b;--an-warm:#f39a5e;--an-warm2:#ffc79c;--an-iron:#4a5260;
  --card-sh:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04);
  --nav-bg:rgba(255,255,255,.92);--toast:#111418;--toast-tx:#ffffff;
  --r:20px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
:root[data-theme=dark]{
  --bg:#0e1116;--s1:#161a21;--s2:#1e232c;--s3:#2a303b;--line:#232933;
  --tx:#f1f3f6;--tx2:#a3aab6;--tx3:#6b7380;
  --pri:#eef1f5;--priink:#0e1116;--ac:#5b8cff;--acq:rgba(91,140,255,.4);--acbg:rgba(91,140,255,.12);--acln:rgba(91,140,255,.4);
  --ok:#34c77b;--okbg:rgba(52,199,123,.12);--okln:rgba(52,199,123,.42);--okink:#06210f;
  --warn:#e0a33a;--warnbg:rgba(224,163,58,.12);--bad:#e0607a;--badbg:rgba(224,96,122,.12);
  --pic-bg:#1e232c;--pic-fig:#e9edf3;--pic-fig2:#7c8594;--pic-eq:#4a5260;--pic-soft:#2a303b;--pic-ac:#5b8cff;--an-body:#a4abb5;--an-line:#2a303a;--an-def:#9aa1ac;--an-far:#5d6572;--an-shine:#fff;--an-hot:#f04a32;--an-hot2:#ff9a7c;--an-warm:#f39a5e;--an-warm2:#ffc79c;--an-iron:#c3c9d2;
  --card-sh:none;--nav-bg:rgba(14,17,22,.92);--toast:#2a303b;--toast-tx:#f1f3f6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,label.btn,nav a,.chip,.list-item,summary,.tab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{padding-top:var(--st);overscroll-behavior-y:none}
.num{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.2px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:1px solid transparent;border-radius:12px;padding:11px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acln)}
input::placeholder{color:var(--tx3)}
.app{max-width:560px;margin:0 auto;padding:0 18px calc(40px + var(--sb))}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:23px;letter-spacing:-.8px}
.brand svg{width:26px;height:26px}
.status{display:flex;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx3)}
.dot.on{background:var(--ok)}
h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.1px;color:var(--tx3);margin:28px 0 10px}
h3{margin:0;font-size:16px;font-weight:600}
.muted{color:var(--tx2)}.faint{color:var(--tx3)}
.card{background:var(--s1);border-radius:var(--r);padding:16px;box-shadow:var(--card-sh)}
.stack>*+*{margin-top:8px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:14px;background:var(--s2);font-weight:600;font-size:14px;white-space:nowrap}
.btn:active,.icon-btn:active,.play:active,.chk:active{transform:scale(.96)}
.btn.pri{background:var(--pri);color:var(--priink)}
.btn.ghost{background:transparent;color:var(--tx2)}
.btn.danger{background:transparent;color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--s1);border-radius:18px;padding:14px 12px;position:relative;overflow:hidden;box-shadow:var(--card-sh)}
.tile .v{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:30px;font-weight:600;line-height:1}
.tile .l{font-size:11.5px;color:var(--tx3);margin-top:5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{padding:8px 13px;border-radius:999px;background:var(--s2);font-size:13px;white-space:nowrap;color:var(--tx2)}
.chip.on{background:var(--pri);color:var(--priink);font-weight:600}
.rt{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px}
.rt-sub{font-size:12.5px;color:var(--tx3);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mdots{display:inline-flex;gap:3px}.mdots i{width:8px;height:8px;border-radius:50%;display:block}
.play{width:46px;height:46px;border-radius:50%;background:var(--pri);color:var(--priink);display:flex;align-items:center;justify-content:center;flex:none}
.empty{padding:28px 16px;text-align:center;color:var(--tx3);background:var(--s1);border-radius:var(--r);font-size:14px}
.link{color:var(--tx2);font-size:13px;font-weight:500}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--nav-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:8px 8px calc(8px + var(--sb));z-index:20;border-top:1px solid var(--line)}
nav.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.bar a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--tx3);text-decoration:none;padding:6px 0;font-weight:500}
nav.bar a.on{color:var(--ac)}
nav.bar svg{width:22px;height:22px}
/* ---------- workout (horizontal) ---------- */
#workout{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;padding-top:var(--st)}
#workout.open{display:flex}
.wk-head{flex:none}
.wk-head .in{max-width:560px;margin:0 auto;padding:10px 14px 6px;display:flex;align-items:center;gap:10px}
.wk-name{background:transparent;border:0;padding:0;font-weight:600;font-size:16px}
.wk-time{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:17px;color:var(--tx2)}
.tabs{flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px 14px 10px;scrollbar-width:none;max-width:560px;width:100%;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border-radius:14px;background:var(--s1);box-shadow:var(--card-sh);font-size:12.5px;color:var(--tx2);border:1.5px solid transparent}
.tab .tpic{width:28px;height:28px;border-radius:9px;display:block}
.tab i{font-style:normal;font-size:11px;color:var(--tx3)}
.tab.on{border-color:var(--tx);color:var(--tx)}
.tab.ok{background:var(--okbg)}.tab.ok i{color:var(--ok)}
.slider{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overscroll-behavior-y:contain}
.slide .in{max-width:560px;margin:0 auto;padding:4px 14px calc(140px + var(--sb))}
.exb{background:var(--s1);border-radius:24px;overflow:hidden;box-shadow:var(--card-sh)}
.exb+.exb{margin-top:12px}
.hero{display:flex;gap:14px;align-items:center;padding:14px}
.hero-pic{flex:none}
.hpic,.hero img{width:92px;height:92px;border-radius:20px;display:block;object-fit:cover}
.mtag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px}
.ss{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--acbg);color:var(--ac);letter-spacing:.5px;vertical-align:1px}
.ex-title{font-size:19px;font-weight:700;line-height:1.2;margin:5px 0 4px;letter-spacing:-.2px}
.ex-m{font-size:12.5px;color:var(--tx3)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--tx2);background:transparent;flex:none}
.coach{margin:0 12px 6px;border-radius:16px;background:var(--s2)}
.coach summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;cursor:pointer}
.coach summary::-webkit-details-marker{display:none}
.pill{font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--s3);color:var(--tx2);white-space:nowrap}
.coach.up .pill{background:var(--okbg);color:var(--ok)}
.coach.reps .pill{background:var(--acbg);color:var(--ac)}
.coach.hold .pill{background:var(--warnbg);color:var(--warn)}
.coach.deload .pill{background:var(--badbg);color:var(--bad)}
.coach-val{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:22px;font-weight:600;line-height:1}
.coach .why{padding:0 12px 12px;font-size:13px;line-height:1.5;color:var(--tx2)}
.coach .why p{margin:0 0 6px}
.chev{color:var(--tx3);transition:transform .2s;flex:none}
.coach[open] .chev{transform:rotate(180deg)}
.sets{padding:6px 10px 4px}
.srow{display:grid;grid-template-columns:34px 1fr 72px 58px 52px;gap:6px;align-items:center;padding:5px 4px;border-radius:14px;min-height:56px;position:relative}
.srow.rpe{grid-template-columns:34px 1fr 64px 52px 48px 52px}
.srow.head{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);min-height:0;padding-top:4px;padding-bottom:0}
.srow.head>div{text-align:center}.srow.head>div:nth-child(2){text-align:left}
.sn{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--tx2);background:var(--s2)}
.srow.warm .sn{color:var(--warn);background:var(--warnbg)}
.srow.drop .sn{color:var(--tx2);background:var(--s2)}
.srow.drop{margin-left:14px}
.srow.drop:before{content:"";position:absolute;left:-9px;top:-4px;width:8px;height:32px;border-left:2px solid var(--s3);border-bottom:2px solid var(--s3);border-bottom-left-radius:8px}
.prev{font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;padding:8px 0}
.srow input{height:46px;padding:0 4px;text-align:center;font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:20px;font-weight:600;border-radius:12px;background:var(--s2)}
.chk{width:50px;height:46px;border-radius:14px;border:2px solid var(--s3);display:flex;align-items:center;justify-content:center;color:var(--tx3);background:transparent}
.srow.done{background:var(--okbg);box-shadow:inset 0 0 0 1.5px var(--okln)}
.srow.done .sn{background:var(--ok);color:var(--okink)}
.srow.done input{background:transparent;color:var(--ok)}
.srow.done .chk{background:var(--ok);border-color:var(--ok);color:var(--okink)}
.srow.done .prev{color:var(--ok);opacity:.8}
.setprog{display:flex;align-items:center;gap:8px;padding:4px 14px 2px;font-size:12px;color:var(--tx3)}
.pbar{flex:1;height:4px;border-radius:4px;background:var(--s3);overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.addset{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px);margin:8px 12px 0;padding:13px;border-radius:14px;border:1.5px dashed var(--s3);color:var(--tx2);font-weight:600;font-size:14px}
.ex-f{display:flex;gap:6px;padding:8px 12px 14px;flex-wrap:wrap}
.ex-f .btn{flex:1}
.nextbtn{display:flex;gap:8px;margin-top:12px}
.nextbtn .btn{flex:1;padding:14px;background:var(--s1)}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:10px 14px calc(12px + var(--sb));background:var(--s1);display:none;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(16,24,40,.08)}
.rest.open{display:block}
.rest .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.rest .btn.sm{padding:12px 14px;font-size:14px;border-radius:12px}
.rest-t{font-family:'Barlow Condensed',Inter,system-ui,sans-serif;font-size:32px;font-weight:600;min-width:84px}
.rest-bar{height:4px;background:var(--s3);border-radius:4px;overflow:hidden;margin:0 auto 10px;max-width:560px}
.rest-bar i{display:block;height:100%;background:var(--ac);width:100%;transition:width 1s linear}
/* ---------- misc ---------- */
.thumb{width:52px;height:52px;flex:none;border-radius:14px;display:block}
.thumb.sm{width:42px;height:42px;border-radius:12px}
.thumb.lg{width:104px;height:104px;border-radius:22px}
img.thumb{object-fit:cover}
.ex-hero{display:flex;gap:14px;align-items:center;margin-top:14px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.45);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--s1);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px 18px calc(22px + var(--sb))}
.sheet h3{font-size:17px;margin-bottom:14px}
.sheet:before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:var(--s3);margin:-8px auto 16px}
@media(min-width:620px){.modal{align-items:center}.sheet{border-radius:24px}}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border-radius:14px;background:var(--s2);font-weight:500;font-size:15px;text-align:left}
.opt+.opt{margin-top:8px}.opt i{width:10px;height:10px;border-radius:50%;flex:none}
.list-item{display:flex;align-items:center;gap:12px;padding:8px 2px;cursor:pointer}
.lbl{font-size:12px;color:var(--tx3);margin:12px 0 5px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ri{background:var(--s2);border-radius:16px;padding:10px;margin-top:8px}
.ri input{background:var(--s3)}
.ri .grid3 input{padding:8px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--sb));transform:translateX(-50%) translateY(20px);background:var(--toast);color:var(--toast-tx);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--ok);color:var(--okink)}
.sess{padding:14px 16px;cursor:pointer}
.sess-meta{font-size:12.5px;color:var(--tx3);margin-top:3px}
.detail{margin-top:12px;font-size:13px}
.detail .dx{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.detail .dx span:last-child{color:var(--tx2);text-align:right}
.pr{color:var(--ac);font-size:11px;font-weight:700}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--s3);border-radius:10px;padding:7px 10px;font-size:12.5px;white-space:nowrap;display:none;z-index:2;box-shadow:0 6px 20px rgba(0,0,0,.4)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td{padding:9px 4px;border-top:1px solid var(--line)}
table.t tr:first-child td{border-top:0}
table.t td.r{text-align:right}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--s3);border-radius:28px;transition:.2s}
.switch span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--ac)}
.switch input:checked+span:before{transform:translateX(18px);background:#fff}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row input{width:96px;text-align:right;padding:8px 10px}
.loading{padding:60px 0;text-align:center;color:var(--tx3)}
details.more summary{list-style:none;cursor:pointer;color:var(--tx2);font-size:13.5px;padding:2px 0}
details.more summary::-webkit-details-marker{display:none}
.method{font-size:13px;color:var(--tx2);line-height:1.55}
.method b{color:var(--tx);font-weight:600}
.big-map{width:220px;height:190px}
.chat-log{height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.bub{align-self:flex-start;max-width:88%;background:var(--s2);padding:10px 13px;border-radius:18px 18px 18px 6px;font-size:14.5px;line-height:1.45}
.bub.me{align-self:flex-end;background:var(--ac);color:#fff;border-radius:18px 18px 6px 18px}
.prop{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:13.5px;color:var(--tx)}
.hello{padding:6px 2px 4px}.hello-t{font-size:30px;font-weight:700;letter-spacing:-.6px;margin:2px 0 4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:18px 0 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--tx3);text-transform:uppercase}
.day b{position:relative;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--tx2);background:var(--s1);box-shadow:var(--card-sh)}
.day.done b{background:var(--pri);color:var(--priink)}
.day.done b:after{content:"";position:absolute;bottom:-7px;width:5px;height:5px;border-radius:50%;background:var(--ac)}
.day b svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.day.today b{box-shadow:inset 0 0 0 2px var(--tx)}.day.today span{color:var(--tx);font-weight:700}
.day.fut b{background:transparent;color:var(--tx3)}
.hero-card{margin-top:18px;border-radius:26px;padding:18px;background:var(--s1);box-shadow:var(--card-sh);position:relative;overflow:hidden}
.hc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hc-tag{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--acbg);color:var(--ac)}
.hc-name{font-size:32px;font-weight:800;letter-spacing:-.8px;margin:14px 0 6px;line-height:1.05}

<div class="rest" id="rest"><div class="rest-bar"><i id="restBar"></i></div><div class="in">
  <div><div class="faint" style="font-size:11px;text-transform:uppercase;letter-spacing:.6px">Repos</div><div class="rest-t" id="restT">0:00</div></div>

<script>
/* ============ utils ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{if(n===''||n==null||isNaN(n))return '';n=Math.round(n*100)/100;return String(n).replace('.',',')};
const pnum=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const DAY=86400000;
const fdate=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const fshort=t=>{const d=new Date(t);return d.toLocaleDateString('fr-FR',d.getFullYear()===new Date().getFullYear()?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'2-digit'})};
const fdur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h${String(m).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
const fmin=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const timeout=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j({code:'timeout'}),ms))]);
function toast(msg,ms=2600,cls=''){const t=$('#toast');t.textContent=msg;t.className='toast'+(cls?' '+cls:'');void t.offsetWidth;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms)}

/* ============ exercise library ============ */
const MUSCLES=['Pectoraux','Dos','Épaules','Jambes','Bras','Abdos'];
const KINDS={barbell:'Barre',dumbbell:'Haltères',machine:'Machine',cable:'Poulie',bw:'Poids du corps / lesté'};
const LIB=[
 ['bench','Développé couché','Pectoraux','barbell'],['incline_bench','Développé incliné barre','Pectoraux','barbell'],
 ['db_bench','Développé couché haltères','Pectoraux','dumbbell'],['incline_db','Développé incliné haltères','Pectoraux','dumbbell'],
 ['dips','Dips lestés','Pectoraux','bw'],['chest_press','Chest press','Pectoraux','machine'],
 ['cable_fly','Écarté poulie','Pectoraux','cable',1],['pec_deck','Pec deck','Pectoraux','machine',1],
 ['pullup','Tractions lestées','Dos','bw'],['chinup','Tractions supination lestées','Dos','bw'],
 ['row','Rowing barre','Dos','barbell'],['tbar','Rowing T-bar','Dos','machine'],
 ['db_row','Rowing haltère unilatéral','Dos','dumbbell'],['lat_pulldown','Tirage vertical','Dos','cable'],
 ['seated_row','Tirage horizontal poulie','Dos','cable'],['deadlift','Soulevé de terre','Dos','barbell'],
 ['rack_pull','Rack pull','Dos','barbell'],['pullover','Pull-over poulie','Dos','cable',1],
 ['shrug','Shrugs haltères','Dos','dumbbell',1],['face_pull','Face pull','Épaules','cable',1],
 ['ohp','Développé militaire','Épaules','barbell'],['db_press','Développé épaules haltères','Épaules','dumbbell'],
 ['lateral','Élévations latérales','Épaules','dumbbell',1],['cable_lateral','Élévations latérales poulie','Épaules','cable',1],
 ['rear_delt','Oiseau machine','Épaules','machine',1],
 ['squat','Squat','Jambes','barbell'],['front_squat','Front squat','Jambes','barbell'],
 ['rdl','Soulevé de terre roumain','Jambes','barbell'],['leg_press','Presse à cuisses','Jambes','machine'],
 ['hack','Hack squat','Jambes','machine'],['bulgarian','Squat bulgare','Jambes','dumbbell'],
 ['lunge','Fentes marchées','Jambes','dumbbell'],['hip_thrust','Hip thrust','Jambes','barbell'],
 ['leg_ext','Leg extension','Jambes','machine',1],['leg_curl','Leg curl','Jambes','machine',1],
 ['calf','Mollets debout','Jambes','machine',1],
 ['curl','Curl barre','Bras','barbell',1],['db_curl','Curl haltères','Bras','dumbbell',1],
 ['hammer','Curl marteau','Bras','dumbbell',1],['preacher','Curl pupitre','Bras','machine',1],
 ['pushdown','Extension triceps poulie','Bras','cable',1],['oh_ext','Extension triceps nuque poulie','Bras','cable',1],
 ['skull','Barre au front','Bras','barbell',1],['close_grip','Développé couché prise serrée','Bras','barbell'],
 ['hanging_leg','Relevés de jambes suspendu','Abdos','bw',1],['cable_crunch','Crunch poulie','Abdos','cable',1],
 ['ab_wheel','Roue abdominale','Abdos','bw',1],
].map(([id,n,m,k,iso])=>({id,n,m,k,iso:!!iso}));

const TPL=[
 {name:'Push — pecs / épaules / triceps',items:[['bench',4,5,8,180],['ohp',3,6,10,150],['incline_db',3,8,12,120],['dips',3,6,10,120],['lateral',3,12,15,60],['pushdown',3,10,15,60]]},
 {name:'Pull — dos lourd',items:[['pullup',4,5,8,180],['row',4,6,8,150],['rack_pull',3,4,6,180],['lat_pulldown',3,8,12,90],['face_pull',3,12,15,60],['curl',3,8,12,60]]},
 {name:'Legs',items:[['squat',4,5,8,180],['rdl',3,6,10,150],['leg_press',3,10,12,120],['leg_curl',3,10,15,60],['calf',4,10,15,60]]},
 {name:'Full body',items:[['deadlift',3,3,5,180],['bench',3,6,8,150],['pullup',3,6,8,150],['bulgarian',3,8,12,90],['hanging_leg',3,10,15,60]]},
];

/* ============ muscle map illustrations ============ */
const MAP=[
 [/leg curl|leg curls/,['hams'],['calves']],
 [/reverse curl|hammer|marteau/,['forearms','biceps'],[]],
 [/pull-?over/,['lats'],['chest','triceps']],
 [/shrug/,['traps'],['forearms']],
 [/face pull|reverse fly|reverse butterfly|oiseau|rear/,['rdelts'],['traps']],
 [/pull-?up|chin-?up|chinup|traction|pulldown|tirage vertical/,['lats','back'],['biceps','rdelts','forearms']],
 [/\brows?\b|rowing|tirage horizontal|t-bar/,['back','lats'],['rdelts','biceps','traps']],
 [/romanian|roumain/,['hams','glutes'],['lowback']],
 [/deadlift|soulevé de terre|rack pull/,['hams','glutes','lowback'],['back','traps','quads','forearms']],
 [/lateral|latérale/,['delts'],['traps']],
 [/shoulder press|militaire|épaules|ohp/,['delts'],['triceps','traps']],
 [/close grip|prise serrée/,['triceps'],['chest','delts']],
 [/skull|barre au front|tricep|pushdown|kickback/,['triceps'],[]],
 [/curl/,['biceps'],['forearms']],
 [/fly|flys|écarté|butterfly|pec deck/,['chest'],['delts']],
 [/bench|développé|chest|dips|push/,['chest'],['triceps','delts']],
 [/leg extension|extension$/,['quads'],[]],
 [/hip thrust/,['glutes'],['hams']],
 [/calf|mollet/,['calves'],[]],
 [/squat|press|lunge|fente|bulgar/,['quads','glutes'],['hams','calves']],
 [/\babs?\b|ab_wheel|abdo|crunch|relev|leg raise|dragon|gainage|plank/,['abs'],[]],
];
const MUS_DEF={Pectoraux:[['chest'],['triceps','delts']],Dos:[['back','lats'],['biceps']],Épaules:[['delts'],['traps']],Jambes:[['quads','glutes'],['hams']],Bras:[['biceps','triceps'],['forearms']],Abdos:[['abs'],[]]};
function musclesOf(ex){const s=(ex.n+' '+ex.id).toLowerCase();for(const [re,p,q] of MAP)if(re.test(s))return {p,q};const d=MUS_DEF[ex.m]||[[],[]];return {p:d[0],q:d[1]}}
const svgCache={};
function bodySvg(ex,cls='thumb'){
  const key=ex.id+cls;if(svgCache[key])return svgCache[key];
  const {p,q}=musclesOf(ex);
  const f=m=>p.includes(m)?'var(--an-hot)':q.includes(m)?'var(--an-warm)':'var(--an-def)';
  const E=(x,y,rx,ry,m,rot)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" style="fill:${f(m)}"${rot?` transform="rotate(${rot} ${x} ${y})"`:''}/>`;
  const sil=c=>`<g style="fill:var(--an-body)"><circle cx="${c}" cy="10" r="6.5"/><rect x="${c-3}" y="15" width="6" height="5" rx="2"/><path d="M${c-13} 21 Q${c} 17 ${c+13} 21 L${c+12} 52 Q${c} 56 ${c-12} 52Z"/><path d="M${c-11} 52 L${c+11} 52 L${c+10} 100 L${c+1.5} 100 L${c} 62 L${c-1.5} 100 L${c-10} 100Z"/><path d="M${c-13} 22 L${c-19} 58 L${c-15} 58 L${c-10} 30Z"/><path d="M${c+13} 22 L${c+19} 58 L${c+15} 58 L${c+10} 30Z"/></g>`;
  const a=30,b=90;
  const front=sil(a)+E(a-11,24.5,4.2,4,'delts')+E(a+11,24.5,4.2,4,'delts')
    +E(a-5,28.5,5.6,4.4,'chest')+E(a+5,28.5,5.6,4.4,'chest')
    +`<rect x="${a-5}" y="34.5" width="10" height="16" rx="3" style="fill:${f('abs')}"/>`
    +E(a-14.5,35,2.8,6,'biceps',12)+E(a+14.5,35,2.8,6,'biceps',-12)
    +E(a-17,48.5,2.4,6.5,'forearms',10)+E(a+17,48.5,2.4,6.5,'forearms',-10)
    +E(a-5.5,69,4.4,11,'quads',4)+E(a+5.5,69,4.4,11,'quads',-4)
    +E(a-5.5,90,2.8,7.5,'calves')+E(a+5.5,90,2.8,7.5,'calves');
  const back=sil(b)+`<path d="M${b-9} 20 L${b} 15.5 L${b+9} 20 L${b+3} 31 L${b-3} 31Z" style="fill:${f('traps')}"/>`
    +E(b-11.5,24.5,4,3.8,'rdelts')+E(b+11.5,24.5,4,3.8,'rdelts')
    +`<path d="M${b-11} 28 Q${b-4} 30 ${b-1.5} 33 L${b-2} 45 Q${b-8} 44 ${b-10} 40Z" style="fill:${f('lats')}"/><path d="M${b+11} 28 Q${b+4} 30 ${b+1.5} 33 L${b+2} 45 Q${b+8} 44 ${b+10} 40Z" style="fill:${f('lats')}"/>`
    +`<path d="M${b-3} 31 L${b+3} 31 L${b+1.5} 37 L${b-1.5} 37Z" style="fill:${f('back')}"/>`
    +`<rect x="${b-3.5}" y="44" width="7" height="7" rx="2" style="fill:${f('lowback')}"/>`
    +E(b-14.5,35,2.8,6,'triceps',12)+E(b+14.5,35,2.8,6,'triceps',-12)
    +E(b-17,48.5,2.4,6.5,'forearms',10)+E(b+17,48.5,2.4,6.5,'forearms',-10)
    +E(b-5,57,5,5,'glutes')+E(b+5,57,5,5,'glutes')
    +E(b-5.5,74,4.2,9.5,'hams',3)+E(b+5.5,74,4.2,9.5,'hams',-3)
    +E(b-5.5,90,3.4,7.5,'calves')+E(b+5.5,90,3.4,7.5,'calves');
  return svgCache[key]=`<svg class="${cls}" viewBox="0 0 120 104" aria-hidden="true">${front}${back}</svg>`;
}
const MUS_FR={chest:'pectoraux',back:'haut du dos',lats:'grands dorsaux',traps:'trapèzes',delts:'deltoïdes',rdelts:'arrière d’épaule',biceps:'biceps',triceps:'triceps',forearms:'avant-bras',abs:'abdos',quads:'quadriceps',hams:'ischios',glutes:'fessiers',calves:'mollets',lowback:'lombaires'};

  const f1=n=>Math.round(n*10)/10;
  const out=[],under=[],hi=[];
  // capsule between a and b with radii r1, r2
  const cap=(a,b,r1,r2,fill)=>{
    const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
    const pts=[[a[0]+nx*r1,a[1]+ny*r1],[b[0]+nx*r2,b[1]+ny*r2],[b[0]-nx*r2,b[1]-ny*r2],[a[0]-nx*r1,a[1]-ny*r1]];
    return `<path d="M${pts.map(q=>f1(q[0])+' '+f1(q[1])).join('L')}Z" fill="${fill}"/><circle cx="${f1(a[0])}" cy="${f1(a[1])}" r="${r1}" fill="${fill}"/><circle cx="${f1(b[0])}" cy="${f1(b[1])}" r="${r2}" fill="${fill}"/>`;
  };

    let s=`<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(rx)}" ry="${f1(ry)}" transform="rotate(${f1(ang)} ${f1(cx)} ${f1(cy)})" fill="${c}"/>`;
    if(c!=='DEF')s+=`<ellipse cx="${f1(cx-nx*ry*.25-1*0)}" cy="${f1(cy-ny*ry*.25-ry*.18)}" rx="${f1(rx*.55)}" ry="${f1(ry*.4)}" transform="rotate(${f1(ang)} ${f1(cx)} ${f1(cy)})" fill="${c}2" opacity=".55"/>`;

const Store={mode:'local',col:null,chains:{},timers:{},
  async init(){

  },
  run(key,fn){
    this.chains[key]=(this.chains[key]||Promise.resolve()).then(async()=>{
      try{await fn()}catch(e){

  later(key,ms,fn){clearTimeout(this.timers[key]);this.timers[key]=setTimeout(()=>this.run(key,fn),ms)},

function recordsOf(exId,extra){
  const ex=getEx(exId),r={heavy:null,r5:null,r10:null,e1:null,setVol:null,sessVol:null};
  const take=(x,date)=>{const t={kg:x.kg,reps:x.reps,date};
    if(!r.heavy||x.kg>r.heavy.kg||(x.kg===r.heavy.kg&&x.reps>r.heavy.reps))r.heavy=t;
    if(x.reps>=5&&(!r.r5||x.kg>r.r5.kg))r.r5=t;if(x.reps>=10&&(!r.r10||x.kg>r.r10.kg))r.r10=t;

  for(const h of histFor(exId)){let sv=0;for(const x of h.sets){take(x,h.date);sv+=x.kg*x.reps}if(!r.sessVol||sv>r.sessVol.v)r.sessVol={v:sv,date:h.date}}
  if(extra)for(const x of extra)take(x,Date.now());
  return r;
}
function prCheck(ent,s){

  if(s.reps>=5&&(!r.r5||s.kg>r.r5.kg))return `meilleure charge à 5 reps (${fmt(s.kg)} kg)`;

/* ============ analytics ============ */
function e1(kg,reps,ex){const L=(kg||0)+bwAdd(ex);if(!reps||reps<=0||L<=0)return 0;return reps===1?L:L*(1+Math.min(reps,15)/30)}
function workSets(e){return (e.sets||[]).filter(x=>!x.warm&&!x.drop&&x.done!==false&&x.kg!=null&&x.reps>0)}
function histFor(exId,beforeTs=Infinity){
  const out=[];
  for(const s of S.sessions){ if(s.date>=beforeTs)continue;
    const es=s.exercises.filter(e=>e.exId===exId);if(!es.length)continue;
    const sets=es.flatMap(workSets);if(sets.length)out.push({date:s.date,sets,sid:s.id,min:es[0].min,max:es[0].max});}
  return out.sort((a,b)=>b.date-a.date);
}
function bestE1(exId,beforeTs){const ex=getEx(exId);let b=0;for(const h of histFor(exId,beforeTs))for(const x of h.sets)b=Math.max(b,e1(x.kg,x.reps,ex));return b}
const roundTo=(w,inc)=>Math.max(0,Math.round(w/inc)*inc);
const r2=v=>Math.round(v*100)/100;
function knownLoads(exId){const k=new Set();for(const h of histFor(exId))for(const x of h.sets)k.add(x.kg);return [...k].sort((a,b)=>a-b)}
function loadUp(exId,w,jump,inc){const k=knownLoads(exId).filter(v=>v>w+1e-6&&v<=w+jump+inc*0.75+1e-6);if(k.length)return k[0];const g=Math.abs(w/inc-Math.round(w/inc))<1e-6;return g?roundTo(w+jump,inc):r2(w+jump)}
function loadDown(exId,target,w,inc){const k=knownLoads(exId).filter(v=>v<w-1e-6&&Math.abs(v-target)<=inc+1e-6);if(k.length)return k.reduce((a,b)=>Math.abs(b-target)<Math.abs(a-target)?b:a);const g=Math.abs(w/inc-Math.round(w/inc))<1e-6;return g?roundTo(target,inc):Math.round(target*4)/4}
const setsStr=sets=>sets.map(x=>`${fmt(x.kg)}×${x.reps}${x.rpe?` @${fmt(x.rpe)}`:''}`).join(' · ');

/* The coach: double progression + RPE autoregulation + stall detection */
function recommend(exId,min,max){
  const ex=getEx(exId),inc=incFor(ex),add=bwAdd(ex),H=histFor(exId);
  const unit=ex.k==='dumbbell'?' kg / haltère':ex.k==='bw'?' kg de lest':' kg';
  if(!H.length) return {tag:'new',label:'1ʳᵉ fois',w:null,reps:max,
    why:`Pas encore d’historique. Choisis une charge qui te permet ${max} reps propres en gardant 2-3 reps en réserve (RPE 7-8). Le coach s’en servira comme base dès la prochaine séance.`};
  const last=H[0],sets=last.sets;
  const topW=Math.max(...sets.map(x=>x.kg));
  const top=sets.filter(x=>x.kg===topW);
  const lo=Math.min(...top.map(x=>x.reps));
  const allMax=top.every(x=>x.reps>=max);
  const rp=top.map(x=>+x.rpe).filter(x=>x>0);const rpe=rp.length?rp.reduce((a,b)=>a+b,0)/rp.length:null;
  let w=topW,reps,tag,why,label;
  if(allMax){
    if(rpe!=null&&rpe>=9.5){tag='hold';label='Consolider';reps=max;
      why=`Haut de fourchette atteint (${max} reps) mais à l’échec (RPE ${fmt(Math.round(rpe*10)/10)}). Refais la même charge en visant des reps plus « propres » avant d’augmenter.`}
    else{const jump=(rpe!=null&&rpe<=7&&2*inc<=0.1*(topW+add))?2*inc:inc;w=loadUp(exId,topW,jump,inc);reps=min;tag='up';label='+ Charge';
      why=`Toutes tes séries à ${fmt(topW)} kg ont atteint ${max} reps${rpe!=null?` (RPE moyen ${fmt(Math.round(rpe*10)/10)})`:''} : on monte à ${fmt(w)} kg (+${fmt(r2(w-topW))}) et on repart du bas de fourchette (${min} reps).${jump>inc?' Gros saut car il te restait de la marge.':''}`}
  }else if(lo>=min){
    reps=Math.min(max,lo+1);tag='reps';label='+ Reps';
    why=`Double progression : garde ${fmt(topW)} kg et ajoute 1 rep sur ta série la plus faible (${lo} → ${reps}). Quand toutes les séries atteignent ${max}, on augmente la charge.`;
  }else{
    const prev=H[1];let prevFail=false;
    if(prev){const pw=Math.max(...prev.sets.map(x=>x.kg));if(pw===topW)prevFail=Math.min(...prev.sets.filter(x=>x.kg===pw).map(x=>x.reps))<min}
    if(prevFail){w=loadDown(exId,(topW+add)*0.9-add,topW,inc);reps=Math.round((min+max)/2);tag='deload';label='Décharge';
      why=`Deux séances de suite sous ${min} reps à ${fmt(topW)} kg : décharge de 10 % (${fmt(w)} kg) pour relancer la progression. Tu remonteras vite.`}
    else{reps=min;tag='hold';label='Consolider';
      why=`Dernière séance sous la fourchette (${lo} reps). On garde ${fmt(topW)} kg et on vise au moins ${min} reps partout. Si ça recoince la prochaine fois, le coach proposera une décharge.`}
  }
  // stall detection over last 3 sessions
  let stall='';
  if(H.length>=3&&tag!=='up'&&tag!=='deload'){
    const score=h=>{const tw=Math.max(...h.sets.map(x=>x.kg));return tw*1000+h.sets.filter(x=>x.kg===tw).reduce((a,x)=>a+x.reps,0)};
    if(score(H[0])<=score(H[1])&&score(H[1])<=score(H[2]))stall='Aucun progrès sur 3 séances : pense sommeil / récup, ou change de variante pendant 3-4 semaines.';
  }
  w=Math.max(0,w);
  const best=bestE1(exId);
  let pred=null;const L=w+add;if(best&&L>0){pred=Math.floor(30*(best/L-1));if(pred<1||pred>20)pred=null}
  // warm-up ramp for heavy compounds
  let warm=null;
  if(!ex.iso&&(ex.k==='barbell')&&w>=40){
    const bar=20;const ramp=[[.5,8],[.7,5],[.85,2]].map(([p,r])=>[Math.max(bar,roundTo(w*p,2.5)),r]).filter((x,i,a)=>x[0]<w&&(i===0||x[0]!==a[i-1][0]));
    if(ramp.length)warm=ramp;
  }
  return {tag,label,w,reps,why,stall,unit,last,best,pred,warm,add};
}

function vStats(){
  if(!S.sessions.length)return `<h2>Statistiques</h2><div class="empty">Termine une séance pour voir tes stats.</div>`;
  const now=Date.now(),d30=S.sessions.filter(s=>s.date>=now-30*DAY);
  const vol30=d30.reduce((a,s)=>a+sessVol(s),0),dur=d30.filter(s=>s.duration).map(s=>s.duration);
  const avg=dur.length?dur.reduce((a,b)=>a+b,0)/dur.length:0;
  // weekly volume, last 12 weeks
  const t=new Date();const mon=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7)).getTime();
  const weeks=[...Array(12)].map((_,i)=>{const a=mon-(11-i)*7*DAY,b=a+7*DAY;const ss=S.sessions.filter(s=>s.date>=a&&s.date<b);return {a,n:ss.length,v:ss.reduce((x,s)=>x+sessVol(s),0)}});
  const vmax=Math.max(1,...weeks.map(w=>w.v));
  // sets per muscle, 30 days
  const mus={};for(const s of d30)for(const e of s.exercises){const m=getEx(e.exId).m;mus[m]=(mus[m]||0)+workSets(e).length}
  const mrows=Object.entries(mus).sort((a,b)=>b[1]-a[1]);const mmax=Math.max(1,...mrows.map(r=>r[1]));
  // recent records
  const best={},prs=[];
  for(const s of [...S.sessions].sort((a,b)=>a.date-b.date))for(const e of s.exercises){const ex=getEx(e.exId);let top=0,set=null;for(const x of workSets(e)){const v=e1(x.kg,x.reps,ex);if(v>top){top=v;set=x}}
    if(top>0){if(best[e.exId]&&top>best[e.exId]+0.01)prs.push({t:s.date,ex,v:top,d:top-best[e.exId],set});best[e.exId]=Math.max(best[e.exId]||0,top)}}
  const recent=prs.slice(-6).reverse();
  return `<h2>Statistiques</h2>
  <div class="tiles"><div class="tile"><div class="v num">${d30.length}</div><div class="l">séances · 30 j</div></div><div class="tile"><div class="v num">${fmt(Math.round(vol30/100)/10)}<small style="font-size:14px;color:var(--tx3)"> t</small></div><div class="l">volume · 30 j</div></div><div class="tile"><div class="v num">${fdur(avg)}</div><div class="l">durée moyenne</div></div></div>
  <div class="card" style="margin-top:10px"><div class="row between"><b style="font-size:14px">Volume par semaine</b><span class="faint" style="font-size:12px">12 semaines</span></div>
    <div class="wbars">${weeks.map((w,i)=>`<div class="wb" title="Semaine du ${fshort(w.a)} : ${fmt(Math.round(w.v/100)/10)} t · ${w.n} séance${w.n>1?'s':''}"><i style="height:${Math.max(w.v?4:0,w.v/vmax*100)}%;${i===11?'background:var(--ac)':''}"></i></div>`).join('')}</div>
    <div class="row between faint" style="font-size:11px;margin-top:6px"><span>${fshort(weeks[0].a)}</span><span>cette semaine · ${fmt(Math.round(weeks[11].v/100)/10)} t</span></div></div>
  <div class="card" style="margin-top:10px"><div class="row between"><b style="font-size:14px">Séries par muscle</b><span class="faint" style="font-size:12px">30 jours</span></div>
    ${mrows.map(([m,n])=>`<div class="mrow"><span>${esc(m)}</span><div class="mb"><i style="width:${n/mmax*100}%"></i></div><b class="num">${n}</b></div>`).join('')||'<div class="faint" style="padding-top:8px">Rien sur 30 jours.</div>'}</div>
  <div class="card" style="margin-top:10px"><b style="font-size:14px">Records récents</b>
    ${recent.map(p=>`<div class="list-item" style="cursor:default">${thumbOf(p.ex,'thumb sm')}<div class="grow"><div style="font-size:14px">${esc(p.ex.n)}</div><div class="faint" style="font-size:12px">${fshort(p.t)} · ${fmt(p.set.kg)} kg × ${p.set.reps}</div></div><div style="text-align:right"><b class="num" style="font-size:18px">${fmt(Math.round(p.v))}</b><div class="pr">+${fmt(Math.round(p.d*10)/10)} kg</div></div></div>`).join('')||'<div class="faint" style="padding-top:8px">Pas encore de record battu.</div>'}</div>`;
}

let exQ='',exMus='',exFrom=false;
function exStats(){const m={};for(const s of S.sessions)for(const e of s.exercises){const ws=workSets(e);if(!ws.length)continue;const ex=getEx(e.exId);const o=m[e.exId]||(m[e.exId]={n:0,last:0,best:0,top:null});o.n++;
  if(s.date>o.last){o.last=s.date;o.top=ws.reduce((a,x)=>e1(x.kg,x.reps,ex)>e1(a.kg,a.reps,ex)?x:a,ws[0])}for(const x of ws)o.best=Math.max(o.best,e1(x.kg,x.reps,ex))}return m}
function exListHtml(){
  const st=exStats(),norm=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const q=norm(exQ);
  const list=allEx().filter(e=>(!exMus||subOf(e)===exMus)&&(!q||norm(e.n).includes(q)));
  const done=list.filter(e=>st[e.id]).sort((a,b)=>st[b.id].last-st[a.id].last),never=list.filter(e=>!st[e.id]);
  const row=e=>{const o=st[e.id];return `<a class="exrow" href="#progres" data-a="openEx" data-id="${e.id}">${thumbOf(e,'thumb')}<div class="grow"><div class="exr-n">${esc(e.n)}</div><div class="exr-s">${esc(subOf(e))}${o?` · ${o.n} séance${o.n>1?'s':''} · ${ago(o.last)}`:''}</div></div>${o?`<div class="exr-v"><b class="num">${fmt(o.top.kg)}×${o.top.reps}</b><small>1RM ${fmt(Math.round(o.best))}</small></div>`:'<span class="faint">›</span>'}</a>`};
  return (done.length?`<div class="eyebrow" style="margin:16px 2px 8px">Pratiqués · ${done.length}</div><div class="card exlist">${done.map(row).join('')}</div>`:'')
    +(never.length?`<details class="more" style="margin-top:16px" ${q||exMus?'open':''}><summary class="eyebrow" style="padding:4px 2px">Jamais faits · ${never.length} ›</summary><div class="card exlist" style="margin-top:8px">${never.map(row).join('')}</div></details>`:'')
    +(!list.length?'<div class="empty" style="margin-top:14px">Aucun exercice trouvé.</div>':'');
}

function weekStats(){
  const now=Date.now(),d=new Date();const monday=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)).getTime();
  const wk=S.sessions.filter(s=>s.date>=monday);
  const vol7=S.sessions.filter(s=>s.date>=now-7*DAY).reduce((a,s)=>a+sessVol(s),0);
  return {wk:wk.length,vol7,total:S.sessions.length};
}
function sessVol(s){return s.exercises.reduce((a,e)=>a+workSets(e).reduce((b,x)=>b+x.kg*x.reps,0),0)}
const MAB={Pectoraux:'Pecs',Dos:'Dos',Épaules:'Épaules',Jambes:'Jambes',Bras:'Bras',Abdos:'Abdos'};
const mdots=ids=>{const ms=[...new Set(ids.map(i=>getEx(i).m))];return `<span class="mnames">${ms.map(m=>esc(MAB[m]||m)).join(' · ')}</span><span class="faint">·</span>`};

const PLAY='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';

  const best={},prs=[];
  for(const s of [...S.sessions].sort((a,b)=>a.date-b.date))for(const e of s.exercises){const ex=getEx(e.exId);let top=0,set=null;for(const x of workSets(e)){const v=e1(x.kg,x.reps,ex);if(v>top){top=v;set=x}}
    if(top>0){if(best[e.exId]&&top>best[e.exId]+0.01)prs.push({t:s.date,ex,v:top,d:top-best[e.exId],set});best[e.exId]=Math.max(best[e.exId]||0,top)}}
  return prs.slice(-n).reverse();

function sortable(list,onMove){
  list.addEventListener('pointerdown',e=>{
    const g=e.target.closest('.grip');if(!g||!list.contains(g))return;const item=g.closest('[data-sort]');if(!item)return;
    e.preventDefault();const items=[...list.querySelectorAll(':scope > [data-sort]')];const from=items.indexOf(item);
    const rects=items.map(i=>i.getBoundingClientRect());const gap=items.length>1?Math.max(0,rects[1].top-rects[0].bottom):8;
    const startY=e.clientY;let to=from;item.classList.add('dragging');try{g.setPointerCapture(e.pointerId)}catch(err){}
    try{navigator.vibrate&&navigator.vibrate(12)}catch(err){}
    const move=ev=>{const dy=ev.clientY-startY;item.style.transform=`translateY(${dy}px)`;const cy=rects[from].top+rects[from].height/2+dy;to=from;
      for(let k=0;k<from;k++)if(cy<rects[k].top+rects[k].height/2){to=k;break}
      if(to===from)for(let k=items.length-1;k>from;k--)if(cy>rects[k].top+rects[k].height/2){to=k;break}
      const hgt=rects[from].height+gap;items.forEach((it,k)=>{if(it===item)return;let sh=0;if(from<to&&k>from&&k<=to)sh=-hgt;if(from>to&&k>=to&&k<from)sh=hgt;it.style.transform=sh?`translateY(${sh}px)`:''})};
    const up=()=>{g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);
      items.forEach(it=>{it.style.transform='';it.classList.remove('dragging')});if(to!==from)onMove(from,to)};
    g.addEventListener('pointermove',move);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
  });
}

/* ============ modal helpers ============ */
let modalClose=null;
function openModal(html,onMount,onClose){$('#sheet').innerHTML=html;$('#modal').classList.add('open');modalClose=onClose||null;onMount&&onMount($('#sheet'))}
function closeModal(){$('#modal').classList.remove('open');$('#sheet').innerHTML='';const f=modalClose;modalClose=null;f&&f()}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function ask(msg,ok='Confirmer',danger=false){return new Promise(res=>{let done=false;
  openModal(`<h3>${esc(msg)}</h3><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" id="mNo">Annuler</button><button class="btn ${danger?'danger':'pri'}" id="mOk">${esc(ok)}</button></div>`,
    sh=>{$('#mNo',sh).onclick=()=>{done=true;closeModal();res(false)};$('#mOk',sh).onclick=()=>{done=true;closeModal();res(true)}},()=>{if(!done)res(false)})})}

/* exercise picker */
function pickExercise(cb){
  let q='',mus='';
  const draw=sh=>{
    const list=allEx().filter(e=>(!mus||subOf(e)===mus)&&(!q||e.n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q)));
    $('#pkList',sh).innerHTML=list.map(e=>`<div class="list-item" data-pick="${e.id}">${thumbOf(e,'thumb sm')}<div class="grow"><div>${esc(e.n)}</div><div class="faint" style="font-size:12px">${subOf(e)} · ${KINDS[e.k]}${e.iso?' · isolation':''}</div></div><span class="faint">+</span></div>`).join('')||'<div class="faint" style="padding:16px 4px">Aucun résultat.</div>';
  };
  openModal(`<h3>Ajouter un exercice</h3><input id="pkQ" placeholder="Rechercher…" autocomplete="off"><div class="chips" style="margin-top:10px" id="pkM"><button class="chip on" data-m="">Tous</button>${PICK_MUS.map(m=>`<button class="chip" data-m="${m}">${m}</button>`).join('')}</div><div id="pkList" style="margin-top:6px"></div>
  <details style="margin-top:12px"><summary class="muted" style="cursor:pointer;padding:6px 0">Créer un exercice perso</summary>
   <label class="lbl">Nom</label><input id="cxN"><div class="grid2"><div><label class="lbl">Muscle</label><select id="cxM">${PICK_MUS.map(m=>`<option>${m}</option>`).join('')}</select></div><div><label class="lbl">Matériel</label><select id="cxK">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div>
   <div class="row between" style="margin-top:10px"><label class="row" style="gap:8px;font-size:14px"><input type="checkbox" id="cxI" style="width:auto"> Isolation</label><button class="btn sm pri" id="cxGo">Créer et ajouter</button></div></details>`,
  sh=>{draw(sh);
    $('#pkQ',sh).oninput=e=>{q=e.target.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');draw(sh)};
    $('#pkM',sh).onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;mus=b.dataset.m;$$('.chip',sh).forEach(c=>c.classList.toggle('on',c===b));draw(sh)};
    $('#pkList',sh).onclick=e=>{const it=e.target.closest('[data-pick]');if(!it)return;closeModal();cb(it.dataset.pick)};
    $('#cxGo',sh).onclick=()=>{const n=$('#cxN',sh).value.trim();if(!n){toast('Donne un nom à l’exercice');return}
      const mv=$('#cxM',sh).value,ex={id:'c_'+uid(),n,m:(mv==='Biceps'||mv==='Triceps')?'Bras':mv,sub:(mv==='Biceps'||mv==='Triceps')?mv:undefined,k:$('#cxK',sh).value,iso:$('#cxI',sh).checked};S.custom.push(ex);Store.saveMeta();closeModal();cb(ex.id)};
  });
}

/* routine editor */
function editRoutine(r,wk){
  const w=wk?clone(wk):(r?clone(r):{id:uid(),name:'',items:[]});const isNew=!r;
  const draw=sh=>{
    $('#reItems',sh).innerHTML=w.items.map((it,i)=>{const nx=w.items[i+1],linked=nx&&it.group&&nx.group===it.group,inG=it.group&&((w.items[i-1]||{}).group===it.group||linked);
      return `<div class="ri" data-sort data-i="${i}" ${inG?'style="box-shadow:inset 3px 0 0 var(--violet)"':''}><div class="row">${GRIP}${thumbOf(getEx(it.exId),'thumb sm')}<b class="grow" style="font-size:14px">${esc(getEx(it.exId).n)}</b><button class="icon-btn" data-rm="${i}" aria-label="Retirer">✕</button></div>
      <div class="grid3" style="margin-top:8px;grid-template-columns:repeat(4,1fr)"><div><div class="faint" style="font-size:11px">Séries</div><input inputmode="numeric" data-f="sets" value="${it.sets}"></div><div><div class="faint" style="font-size:11px">Reps min</div><input inputmode="numeric" data-f="min" value="${it.min}"></div><div><div class="faint" style="font-size:11px">Reps max</div><input inputmode="numeric" data-f="max" value="${it.max}"></div><div><div class="faint" style="font-size:11px">Repos (s)</div><input inputmode="numeric" data-f="rest" value="${it.rest}"></div></div>
      ${nx?`<button class="link" data-link="${i}" style="margin-top:8px;font-size:12.5px;${linked?'color:var(--violet);font-weight:600':''}">${linked?'⛓ En biset avec le suivant — séparer':'+ Biset avec le suivant'}</button>`:''}</div>`}).join('')||'<div class="faint" style="padding:10px 0">Ajoute des exercices.</div>';
  };
  openModal(`<h3>${isNew?'Nouveau programme':'Modifier le programme'}</h3><input id="reN" placeholder="Nom (ex. Push lourd)" value="${esc(w.name)}">
   <div class="faint" style="font-size:12px;margin:10px 2px 0">Maintiens ⠿ et fais glisser pour changer l’ordre.</div><div id="reItems" style="margin-top:4px"></div>
   <button class="btn block" id="reAdd" style="margin-top:10px">+ Ajouter un exercice</button>
   <div class="row" style="margin-top:16px">${isNew?'':'<button class="btn danger" id="reDel">Supprimer</button>'}<div class="grow"></div><button class="btn ghost" id="reCancel">Annuler</button><button class="btn pri" id="reSave">Enregistrer</button></div>`,
  sh=>{draw(sh);
    sortable($('#reItems',sh),(a,b)=>{moveItem(w.items,a,b);draw(sh)});
    $('#reN',sh).oninput=e=>w.name=e.target.value;
    $('#reItems',sh).oninput=e=>{const f=e.target.dataset.f;if(!f)return;const i=+e.target.closest('[data-i]').dataset.i;const v=parseInt(e.target.value);if(!isNaN(v))w.items[i][f]=v};
    $('#reItems',sh).onclick=e=>{const x=e.target.closest('[data-rm]'),lk=e.target.closest('[data-link]');
      if(lk){const i=+lk.dataset.link,a=w.items[i],b=w.items[i+1];if(a.group&&b.group===a.group){b.group=null;if(!w.items.some((q,k)=>k!==i&&q.group===a.group))a.group=null}else{const g=a.group||b.group||'g'+uid();a.group=g;b.group=g}draw(sh);return}
      if(x){w.items.splice(+x.dataset.rm,1);draw(sh)}};
    $('#reAdd',sh).onclick=()=>{const snap=clone(w);pickExercise(id=>{const ex=getEx(id),[a,b]=defRange(ex);snap.items.push({exId:id,sets:3,min:a,max:b,rest:ex.iso?75:S.settings.rest});editRoutine(r,snap)})};
    $('#reCancel',sh).onclick=closeModal;
    $('#reSave',sh).onclick=()=>{if(!w.name.trim())w.name='Programme';
      w.items.forEach(it=>{it.sets=Math.max(1,Math.min(10,it.sets||3));it.min=Math.max(1,it.min||1);it.max=Math.max(it.min,it.max||it.min);it.rest=Math.max(0,it.rest||0)});
      const i=S.routines.findIndex(x=>x.id===w.id);if(i>=0)S.routines[i]=w;else S.routines.push(w);Store.saveMeta();closeModal();render();toast('Programme enregistré')};
    const del=$('#reDel',sh);if(del)del.onclick=async()=>{if(await ask(`Supprimer « ${w.name} » ?`,'Supprimer',true)){S.routines=S.routines.filter(x=>x.id!==w.id);Store.saveMeta();render()}};
  });
}
/* ============ workout ============ */
function newExEntry(exId,sets,min,max,rest,group){const ex=getEx(exId),[a,b]=defRange(ex);
  return {uid:uid(),exId,group:group||null,min:min||a,max:max||b,rest:rest!=null?rest:(ex.iso?75:S.settings.rest),sets:Array.from({length:sets||3},()=>({kg:null,reps:null,rpe:null,warm:false,drop:false,done:false}))}}
function startWorkout(name,exs,routineId){
  S.active={id:uid(),start:Date.now(),name,routineId:routineId||null,exercises:exs,cur:0};Store.saveActive();openWorkout();
}
let recCache={};
function openWorkout(){recCache={};keepAwake(true);$('#workout').classList.add('open');document.body.style.overflow='hidden';drawWorkout()}
function closeWorkout(){keepAwake(false);$('#workout').classList.remove('open');document.body.style.overflow='';stopRest();render()}
function recOf(e){const k=e.uid+':'+e.min+':'+e.max;if(!recCache[k])recCache[k]=recommend(e.exId,e.min,e.max);return recCache[k]}
function slidesOf(A){const out=[];for(const e of A.exercises){const last=out[out.length-1];if(e.group&&last&&last[0].group===e.group)last.push(e);else out.push([e])}return out}
const workOf=e=>e.sets.filter(s=>!s.warm);
const exDone=e=>{const w=workOf(e);return w.length>0&&w.every(s=>s.done)};
const shortName=n=>{const s=n.split(' · ')[0];return s.length>18?s.slice(0,17)+'…':s};
const CHEV='<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
const PILL={up:'↑ Charge',reps:'+1 rep',hold:'= Garder',deload:'↓ Décharge',new:'1ʳᵉ fois'};
const CIRCLE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4 8-9" opacity=".55"/></svg>';
const CHECK='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 12.5l4.2 4.2 8.8-9.4"/></svg>';

function drawWorkout(){
  const A=S.active;if(!A)return closeWorkout();
  const sl=slidesOf(A);A.cur=Math.max(0,Math.min(A.cur||0,sl.length));
  $('#workout').innerHTML=`<div class="wk-head"><div class="in"><button class="icon-btn" data-w="min" aria-label="Réduire"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="grow"><input class="wk-name" data-w="name" value="${esc(A.name)}"><div class="wk-time num" id="wkTime">${fdur((Date.now()-A.start)/1000)}</div></div>
    <button class="icon-btn" data-w="trainer" aria-label="Trainer" style="background:var(--s1);color:var(--blue)"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg></button><button class="btn pri" data-w="finish">Terminer</button></div></div>
    <div class="tabs" id="wkTabs"></div>
    <div class="slider" id="wkSlider">${sl.map((g,i)=>{const bn=sl.slice(0,i).filter(x=>x.length>1).length;return `<div class="slide" data-i="${i}"><div class="in">${g.map((e,j)=>exBlock(e,g.length>1?String.fromCharCode(65+bn%26)+(j+1):'')).join('')}
        <div class="nextbtn">${i>0?'<button class="btn" data-w="prev">← Précédent</button>':''}<button class="btn" data-w="next">${i<sl.length-1?'Suivant →':'Fin de séance →'}</button></div></div></div>`}).join('')}
      <div class="slide" data-i="${sl.length}"><div class="in"><div class="card" style="text-align:center;padding:26px 18px">
        <div style="font-size:15px;font-weight:600">${sl.filter(g=>g.every(exDone)).length} / ${sl.length} exercices terminés</div>
        <div class="faint" style="font-size:13px;margin-top:4px">${fdur((Date.now()-A.start)/1000)} de séance</div>
        <button class="btn pri block" data-w="finish" style="margin-top:18px;padding:15px">Terminer la séance</button>
        <button class="btn block" data-w="addEx" style="margin-top:8px;padding:14px">+ Ajouter un exercice</button>
        <button class="btn block ghost" data-w="cancel" style="margin-top:6px;color:var(--tx3)">Abandonner</button></div></div></div>
    </div>`;
  drawTabs();
  const sld=$('#wkSlider');
  requestAnimationFrame(()=>{sld.scrollLeft=A.cur*sld.clientWidth});
  let t;sld.onscroll=()=>{clearTimeout(t);t=setTimeout(()=>{const i=Math.round(sld.scrollLeft/sld.clientWidth);if(i!==A.cur){A.cur=i;drawTabs();Store.saveActive()}},60)};
}
function drawTabs(){
  const A=S.active,el=$('#wkTabs');if(!A||!el)return;const sl=slidesOf(A);
  el.innerHTML=sl.map((g,i)=>{const ex=getEx(g[0].exId);const w=g.flatMap(workOf);const d=w.filter(s=>s.done).length;
    return `<button class="tab ${i===A.cur?'on':''} ${g.every(exDone)?'ok':''}" data-w="go" data-i="${i}">${thumbOf(ex,'tpic')}<span>${g.length>1?'Biset':esc(shortName(ex.n))}</span><i>${d}/${w.length}</i></button>`}).join('')
    +`<button class="tab ${A.cur===sl.length?'on':''}" data-w="go" data-i="${sl.length}" style="padding-left:12px">🏁<span>Fin</span></button>`
    +`<button class="tab" data-w="reorder" style="padding:5px 12px" aria-label="Réorganiser">⇅<span>Ordre</span></button>`;
  const on=el.querySelector('.tab.on');if(on)on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
function reorderSheet(){
  const A=S.active;if(!A)return;
  const draw=sh=>{const sl=slidesOf(A);
    $('#roList',sh).innerHTML=sl.map((g,i)=>`<div class="ro" data-sort>${GRIP}${picto(getEx(g[0].exId),'thumb sm')}<div class="grow"><div style="font-size:14.5px">${g.map(e=>esc(shortName(getEx(e.exId).n))).join(' + ')}</div><div class="faint" style="font-size:12px">${g.length>1?'Biset · ':''}${g.flatMap(workOf).filter(s=>s.done).length}/${g.flatMap(workOf).length} séries</div></div></div>`).join('')};
  openModal(`<h3>Ordre des exercices</h3><div class="faint" style="font-size:12.5px;margin:-6px 0 10px">Maintiens ⠿ et fais glisser.</div><div id="roList"></div><button class="btn pri block" id="roOk" style="margin-top:14px">OK</button>`,
  sh=>{draw(sh);
    sortable($('#roList',sh),(a,b)=>{const sl=slidesOf(A);const cur=sl[A.cur];moveItem(sl,a,b);A.exercises=sl.flat();const ni=sl.indexOf(cur);if(ni>=0)A.cur=ni;Store.saveActive();draw(sh);drawWorkout()});
    $('#roOk',sh).onclick=closeModal});
}
function goSlide(i){const sld=$('#wkSlider');if(!sld)return;sld.scrollTo({left:i*sld.clientWidth,behavior:'smooth'})}

function exBlock(e,label){
  const ex=getEx(e.exId),r=recOf(e),rpe=S.settings.rpe,c=mcol(ex);
  const prevSets=r.last?r.last.sets:[];
  let wi=0,prevKg=null;
  const rows=e.sets.map((s,i)=>{
    const pi=(s.warm||s.drop)?-1:wi++;const pv=pi>=0?prevSets[pi]:null;
    let phK='',phR='';
    if(s.drop){const base=e.sets.slice(0,i).reverse().find(x=>!x.warm);const bk=base?(base.kg??(r.w??null)):null;phK=bk!=null?fmt(loadDown(e.exId,bk*0.8,bk,incFor(ex))):''}
    else if(!s.warm){phK=r.w!=null?fmt(r.w):(pv?fmt(pv.kg):'');phR=r.reps||''}
    const lab=s.done?CHECK:(s.warm?'É':s.drop?'D':pi+1);
    return `<div class="srow ${rpe?'rpe':''} ${s.done?'done':''} ${s.warm?'warm':''} ${s.drop?'drop':''}" data-s="${i}">
      <button class="sn" data-x="type" aria-label="Type de série">${lab}</button>
      <button class="prev" data-x="prev">${s.pr&&s.done?'<span class="prtag">🏆 record</span>':s.drop?'drop':s.warm?'échauff.':pv?`${fmt(pv.kg)} × ${pv.reps}`:'—'}</button>
      <input inputmode="decimal" enterkeyhint="next" data-x="kg" value="${fmt(s.kg)}" placeholder="${phK}" aria-label="kg">
      <input inputmode="numeric" enterkeyhint="done" data-x="reps" value="${s.reps??''}" placeholder="${phR}" aria-label="reps">
      ${rpe?`<input inputmode="decimal" data-x="rpe" value="${fmt(s.rpe)}" placeholder="RPE" aria-label="RPE">`:''}
      <button class="chk" data-x="done" aria-label="${s.done?'Série validée':'Valider la série'}">${s.done?CHECK:CIRCLE}</button></div>`}).join('');
  const w=workOf(e),d=w.filter(s=>s.done).length;
  return `<section class="exb" data-u="${e.uid}" style="--mc:${c}">
   <div class="hero"><button class="hero-pic" data-x="photo">${thumbOf(ex,'hpic')}</button>
     <div class="grow"><span class="mtag">${esc(ex.m)}</span>${label?`<span class="ss">${label}</span>`:''}<div class="ex-title">${esc(ex.n)}</div><div class="ex-m">${e.min}–${e.max} reps · repos ${fmin(e.rest)}</div></div>
     <button class="icon-btn" data-x="menu" aria-label="Options" style="align-self:flex-start">${ICON.more}</button></div>
   ${(S.notes||{})[ex.id]?`<button class="note" data-x="note">📝 ${esc(S.notes[ex.id])}</button>`:`<button class="note empty" data-x="note">+ Note (réglage, prise…)</button>`}
   <details class="coach ${r.tag}"><summary><span class="pill">${PILL[r.tag]}</span><span class="coach-val">${r.w!=null?`${fmt(r.w)} × ${r.reps}`:`${r.reps} reps`}</span>${r.stall?'<span style="color:var(--warn)" title="Plateau">●</span>':''}<div class="grow"></div>${r.w!=null?'<button class="btn sm pri" data-x="apply">Appliquer</button>':''}${CHEV}</summary>
     <div class="why"><p>${esc(r.why)}</p>${r.warm?`<p>Échauffement conseillé : ${r.warm.map(x=>`${fmt(x[0])}×${x[1]}`).join(' · ')}</p>`:''}${r.stall?`<p style="color:var(--warn)">${esc(r.stall)}</p>`:''}</div></details>
   <div class="setprog"><span>${d}/${w.length} séries validées</span><div class="pbar"><i style="width:${w.length?d/w.length*100:0}%"></i></div></div>
   <div class="sets"><div class="srow head ${rpe?'rpe':''}"><div></div><div>Avant</div><div>${ex.k==='bw'?'+kg':'kg'}</div><div>Reps</div>${rpe?'<div>RPE</div>':''}<div></div></div>${rows}</div>
   <button class="addset" data-x="addset"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter une série</button>
   <div class="ex-f"><button class="btn sm" data-x="drop" style="color:var(--pink)">+ Dropset</button>${r.warm?'<button class="btn sm" data-x="warm" style="color:var(--warn)">+ Échauffement</button>':''}</div>
  </section>`;
}
function redrawEx(u){const A=S.active,e=A.exercises.find(x=>x.uid===u);const el=$(`.exb[data-u="${u}"]`);if(e&&el){const lab=el.querySelector('.ss');const tmp=document.createElement('div');tmp.innerHTML=exBlock(e,lab?lab.textContent:'');el.replaceWith(tmp.firstElementChild)}drawTabs()}

$('#workout').addEventListener('input',e=>{
  const A=S.active;if(!A)return;
  if(e.target.dataset.w==='name'){A.name=e.target.value;Store.saveActive();return}
  const x=e.target.dataset.x;if(!['kg','reps','rpe'].includes(x))return;
  const exEl=e.target.closest('.exb'),ent=A.exercises.find(q=>q.uid===exEl.dataset.u),s=ent.sets[+e.target.closest('[data-s]').dataset.s];
  const v=pnum(e.target.value);s[x]=x==='reps'&&v!=null?Math.round(v):(x==='rpe'&&v!=null?Math.min(10,Math.max(1,v)):v);Store.saveActive();
});
function afterValidate(ent,s){
  const pr=prCheck(ent,s);if(pr){s.pr=true;Store.saveActive();redrawEx(ent.uid);try{navigator.vibrate&&navigator.vibrate([60,60,60,60,160])}catch(e){}}
  const toast=(m,ms,c)=>window.toast(pr?`🏆 Nouveau record : ${pr}`:m,pr?4000:ms,pr?'':c);
  const A=S.active,ex=getEx(ent.exId),i=ent.sets.indexOf(s);
  const next=ent.sets.slice(i+1).find(x=>!x.done);
  const sl=slidesOf(A),gi=sl.findIndex(g=>g.includes(ent)),g=sl[gi];
  if(s.warm){toast('Échauffement validé');return}
  if(next&&next.drop){toast(`✓ Validé — enchaîne le drop sans repos`,2600,'ok');return}
  if(g.length>1){const j=g.indexOf(ent);const other=g[(j+1)%g.length];
    if(j<g.length-1&&other.sets.some(x=>!x.done&&!x.warm)){toast(`✓ Validé — enchaîne avec ${shortName(getEx(other.exId).n)}`,2800,'ok');return}}
  const n=workOf(ent).filter(x=>x.done).length;
  if(g.every(exDone)){startRest(ent.rest);toast(gi<sl.length-1?'Exercice terminé 💪 — au suivant':'Dernier exercice terminé 💪',2600,'ok');setTimeout(()=>{if(S.active&&A.cur===gi)goSlide(gi+1)},900);return}
  startRest(ent.rest);toast(`✓ Série ${n} validée · repos ${fmin(ent.rest)}`,2400,'ok');
}
function addDropAfter(ent,pi){
  // pi = parent set index; insert after the parent and its existing drops
  let at=pi+1;while(at<ent.sets.length&&ent.sets[at].drop)at++;
  const src=ent.sets[at-1];const r=recOf(ent);const bk=src.kg??(r.w??null);
  ent.sets.splice(at,0,{kg:bk!=null?loadDown(ent.exId,bk*0.8,bk,incFor(getEx(ent.exId))):null,reps:null,rpe:null,warm:false,drop:true,done:false});
  const n=ent.sets.slice(0,pi+1).filter(x=>!x.warm&&!x.drop).length;
  Store.saveActive();redrawEx(ent.uid);toast(`Dropset ajouté sous la série ${n}`);
}
function setTypeSheet(ent,si){

      A.chat.push({role:'user',content:txt});Store.saveActive();$('#trIn',sh).value='';
      const turns=A.chat.map((m,i)=>i===A.chat.length-1?{role:'user',content:`ÉTAT DE LA SÉANCE :\n${trainerContext()}\n\nMESSAGE : ${txt}`}:{role:m.role,content:m.content});
      A.chat.push({role:'assistant',content:''});const idx=A.chat.length-1;draw();
      const bubble=()=>log.querySelector('.bub:last-child');
      if(bubble())bubble().innerHTML='<span class="faint">Je réfléchis…</span>';
      chatCtl=new AbortController();
      try{const text=await trainerCall(turns,t=>{A.chat[idx].content=t;const b=bubble();if(b)b.innerHTML=esc(splitReply(t).say||'…').replace(/\n/g,'<br>');log.scrollTop=log.scrollHeight},chatCtl.signal);
        A.chat[idx].content=text;}
      catch(e){A.chat.pop();const msg={nokey:'Ajoute ta clé API Anthropic dans Réglages pour activer le Trainer.',badkey:'Clé API refusée : vérifie-la dans Réglages.',offline:'Pas de réseau : le Trainer a besoin d’internet.',unavailable:'Le Trainer n’est pas disponible ici.',not_granted:'Accès à Claude refusé pour cette page.',rate_limited:'Trop de messages d’un coup, réessaie dans un moment.',cancelled:''}[e&&e.code];
        if(msg!=='')toast(msg||'Le Trainer n’a pas pu répondre, réessaie.',3500)}
      finally{chatCtl=null;if(A.chat.length>40)A.chat.splice(0,A.chat.length-40);Store.saveActive();draw()}};
    $('#trForm',sh).onsubmit=e=>{e.preventDefault();send($('#trIn',sh).value)};
    $('#trQuick',sh).onclick=e=>{const b=e.target.closest('[data-q]');if(b){const cur=S.active.exercises.find(x=>x.sets.some(s=>!s.done&&!s.warm));send(b.dataset.q+(cur?` (${getEx(cur.exId).n})`:''))}};
    log.onclick=e=>{const b=e.target.closest('[data-apply]');if(!b)return;const m=A.chat[+b.dataset.apply];const n=applyActions(splitReply(m.content).actions);m.applied=true;Store.saveActive();toast(n?'Séance adaptée':'Rien à appliquer');closeModal()};
    $('#trClose',sh).onclick=closeModal;
  },()=>{if(chatCtl){chatCtl.abort();chatCtl=null}});
}

/* rest timer */
let rest={end:0,total:0,iv:null},actx=null;
function startRest(sec){if(!sec)return;try{if(!actx&&S.settings.sound)actx=new (window.AudioContext||window.webkitAudioContext)();actx&&actx.resume&&actx.resume()}catch(e){}
  rest.total=sec;rest.end=Date.now()+sec*1000;$('#rest').classList.add('open');tickRest();clearInterval(rest.iv);rest.iv=setInterval(tickRest,250);armNotif()}
function armNotif(){if(NOTIF_OK&&S.settings.notif&&Notification.permission==='granted')swPost({type:'rest-start',end:rest.end,body:nextSetLabel()})}
function stopRest(){swPost({type:'rest-cancel'});clearInterval(rest.iv);rest.iv=null;$('#rest').classList.remove('open')}
function tickRest(){const left=(rest.end-Date.now())/1000;
  if(left<=0){clearInterval(rest.iv);rest.iv=null;$('#rest').classList.remove('open');beep();
    if(document.visibilityState==='visible')toast('Repos terminé — '+nextSetLabel(),3500);
    return}
  $('#restT').textContent=fmin(Math.ceil(left));$('#restBar').style.width=Math.max(0,left/rest.total*100)+'%'}
function beep(){try{navigator.vibrate&&navigator.vibrate([350,120,350,120,350])}catch(e){}
  if(!S.settings.sound||!actx)return;try{[0,0.25].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}}
$('#rest').addEventListener('click',e=>{const b=e.target.closest('[data-rest]');if(!b)return;const v=b.dataset.rest;
  if(v==='skip'){stopRest();return}rest.end+=(+v)*1000;rest.total=Math.max(rest.total,(rest.end-Date.now())/1000);tickRest();armNotif()});
setInterval(()=>{const el=$('#wkTime');if(el&&S.active)el.textContent=fdur((Date.now()-S.active.start)/1000)},1000);

/* ============ app actions ============ */
$('#app').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='resume')openWorkout();
  else if(a==='startEmpty'){if(S.active)return openWorkout();startWorkout('Séance libre',[])}
  else if(a==='startRoutine'){if(S.active){toast('Une séance est déjà en cours');return openWorkout()}const r=S.routines.find(x=>x.id===id);startWorkout(r.name,r.items.map(i=>newExEntry(i.exId,i.sets,i.min,i.max,i.rest,i.group)),r.id)}
  else if(a==='newRoutine')newRoutineSheet();
  else if(a==='openEx'){e.preventDefault();progEx=id;progAll=false;exFrom=true;location.hash='#progres';if(view==='progres')render()}
  else if(a==='newEx'){pickExercise(id=>{progEx=id;exFrom=true;location.hash='#progres'})}
  else if(a==='imgStyle'){S.settings.img=id;Store.saveMeta();render()}
  else if(a==='theme'){S.settings.theme=id;applyTheme();Store.saveMeta();render()}
  else if(a==='routineSheet')routineSheet(id);
  else if(a==='photo')photoSheet(id,()=>render());
  else if(a==='progAll'){progAll=!progAll;const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='editRoutine')editRoutine(S.routines.find(x=>x.id===id));
  else if(a==='addTpl'){const t=TPL[+b.dataset.i];S.routines.push({id:uid(),name:t.name,items:t.items.map(([exId,sets,min,max,rest])=>({exId,sets,min,max,rest}))});Store.saveMeta();render();toast('Ajouté à tes programmes')}
  else if(a==='toggleSess'){openSess=openSess===id?null:id;const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='delSess'){if(await ask('Supprimer cette séance de l’historique ?','Supprimer',true)){S.sessions=S.sessions.filter(s=>s.id!==id);Store.delSession(id);render()}}
  else if(a==='redo'){if(S.active){toast('Une séance est déjà en cours');return openWorkout()}const s=S.sessions.find(x=>x.id===id);startWorkout(s.name,s.exercises.map(x=>newExEntry(x.exId,Math.max(1,x.sets.filter(q=>!q.warm&&!q.drop).length),x.min,x.max,null,x.group)),s.routineId)}
  else if(a==='export'){const txt=JSON.stringify({app:'surcharge',v:1,settings:S.settings,routines:S.routines,custom:S.custom,sessions:S.sessions});
    const name=`ironlog-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;const blob=new Blob([txt],{type:'application/json'});
    try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sauvegarde Ironlog'});return}}catch(err){if(err&&err.name==='AbortError')return}
    const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Sauvegarde téléchargée')}
  else if(a==='copy'){const txt=JSON.stringify({app:'surcharge',v:1,settings:S.settings,routines:S.routines,custom:S.custom,notes:S.notes,sessions:S.sessions});
    try{await navigator.clipboard.writeText(txt);toast('Sauvegarde copiée — colle-la dans une note')}catch(err){openModal(`<h3>Ta sauvegarde</h3><p class="muted" style="font-size:13px">Sélectionne tout et copie ce texte.</p><textarea rows="8" readonly>${esc(txt)}</textarea><button class="btn block" style="margin-top:10px" id="xOk">Fermer</button>`,sh=>{const ta=$('textarea',sh);ta.focus();ta.select();$('#xOk',sh).onclick=closeModal})}}
  else if(a==='import'){openModal(`<h3>Importer une sauvegarde</h3><p class="muted" style="font-size:13px">Colle le texte copié depuis « Copier une sauvegarde ». Tes données actuelles seront remplacées.</p><label class="btn block" style="margin:6px 0 10px">Choisir un fichier .json<input type="file" id="imF" accept=".json,application/json,text/plain" style="display:none"></label><div class="faint" style="font-size:12px;text-align:center;margin-bottom:6px">ou colle le texte :</div><textarea id="imT" rows="6"></textarea><div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn ghost" id="imNo">Annuler</button><button class="btn pri" id="imGo">Importer</button></div>`,
    sh=>{$('#imNo',sh).onclick=closeModal;
      $('#imF',sh).onchange=async ev=>{const fl=ev.target.files[0];if(!fl)return;try{$('#imT',sh).value=await fl.text();$('#imGo',sh).click()}catch(err){toast('Fichier illisible')}};
      $('#imGo',sh).onclick=async()=>{let d;try{d=JSON.parse($('#imT',sh).value)}catch(err){toast('Texte invalide');return}
      if(!d||!Array.isArray(d.sessions)){toast('Ce n’est pas une sauvegarde Ironlog');return}
      const old=S.sessions.map(s=>s.id);hydrate({...d,active:S.active});applyTheme();ensureEpaulesBras();closeModal();render();toast(Store.mode==='cloud'?'Synchronisation en cours… garde la page ouverte':'Import terminé',5000);await Store.pushAll(old);toast(`${S.sessions.length} séances importées`)}})}
  else if(a==='wipe'){if(await ask('Effacer toutes tes séances, programmes et réglages ? C’est définitif.','Tout effacer',true)){const old=S.sessions.map(s=>s.id);hydrate({});await Store.pushAll(old);render();toast('Données effacées')}}
});
$('#app').addEventListener('change',e=>{
  if(e.target.id==='platesIn'){S.settings.plates=e.target.value;Store.saveMeta();toast('Disques enregistrés');return}
  if(e.target.id==='apiKey'){setKey(e.target.value.trim());toast(e.target.value.trim()?'Clé enregistrée':'Clé supprimée');return}
  if(e.target.id==='progSel'){progEx=e.target.value;progAll=false;render();return}
  if(e.target.dataset.setStr){S.settings[e.target.dataset.setStr]=e.target.value.replace(/\s/g,'');Store.saveMeta();toast('Disques enregistrés');return}
  const k=e.target.dataset.set;if(!k)return;
  if(e.target.type==='checkbox'){S.settings[k]=e.target.checked;
    if(k==='notif'&&e.target.checked){Notification.requestPermission().then(p=>{if(p!=='granted'){S.settings.notif=false;e.target.checked=false;Store.saveMeta();toast('Notifications refusées — autorise-les dans les réglages Android de l’appli')}else toast('Notifications activées')})}}
  else{const v=pnum(e.target.value);if(v!=null&&v>=0)S.settings[k]=v;else e.target.value=fmt(S.settings[k])}
  Store.saveMeta();
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==='progres')mountChart()},150)});

function ensureEpaulesBras(){
  if(S.settings.tplEB1||S.routines.some(r=>r.id==='epaules-bras'))return false;
  const has=id=>S.custom.some(c=>c.id===id)||LIB.some(l=>l.id===id),pick=(id,fb)=>has(id)?id:fb,g1='g'+uid(),g2='g'+uid();
  const it=(exId,rest,group)=>({exId,sets:3,min:8,max:12,rest,group:group||null});
  S.routines.push({id:'epaules-bras',name:'ÉPAULES + BRAS',items:[
    it(pick('ap_5b80cb55','preacher'),90,g1),it(pick('ap_c16600d3','oh_ext'),90,g1),
    it('pushdown',90,g2),it('hammer',90,g2),
    it(pick('ap_ec0006c8','db_press'),120),it(pick('ap_c513beed','cable_lateral'),75),it(pick('ap_b3d307b3','rear_delt'),75)]});
  S.settings.tplEB1=true;Store.saveMeta();return true;
}
function applyTheme(){const t=S.settings.theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):(S.settings.theme||'light');
  document.documentElement.dataset.theme=t;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0e1116':'#f4f5f7';}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.settings.theme==='auto')applyTheme()})}catch(e){}
/* ============ boot ============ */
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
window.addEventListener('online',()=>render());window.addEventListener('offline',()=>render());
(async()=>{
  const r=await Store.init();
  await Photos.load();
  if(!S.settings.th2){S.settings.theme='dark';S.settings.th2=true;Store.saveMeta()}
  applyTheme();
  ensureEpaulesBras();
  BOOTED=true;
  render();
  if(NAME_FIX){NAME_FIX=false;Store.pushAll()}
  if(r==='migrated')toast('Tes données locales ont été synchronisées');
  if(S.active)toast('Séance en cours retrouvée — touche « Reprendre »');
})();
</script>
